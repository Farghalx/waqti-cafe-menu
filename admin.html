<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>لوحة الإدارة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue:#0E2856; --blue-2:#173a72; --gold:#C08C23; --gold-2:#E3B85A;
      --bg:#F4EFE6; --card:#FFFFFF; --ink:#181410; --muted:#8C8475; --line:#ECE4D6;
      --shadow:0 6px 24px rgba(14,40,86,.08); --shadow-lg:0 16px 48px rgba(14,40,86,.16);
      --ok:#2E9E5B; --cancel:#C23B3B;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; }
    /* Hidden until the client's real theme is applied -- see index.html for why. */
    body:not(.ready) { visibility:hidden; }
    body { font-family:'Cairo',sans-serif; background:var(--bg); color:var(--ink); padding-bottom:94px; -webkit-font-smoothing:antialiased; }
    .demoflag { background:#ffce5c; color:#5b4300; text-align:center; font-weight:800; font-size:13px; padding:6px; }
    .hero { background:linear-gradient(135deg,var(--blue) 0%,var(--blue-2) 100%); color:#fff;
      padding:22px 20px 26px; border-bottom-left-radius:26px; border-bottom-right-radius:26px; }
    .hero .cafe { font-size:22px; font-weight:800; }
    .hero .sub { margin-top:4px; font-size:13px; color:rgba(255,255,255,.75); font-weight:600; }

    /* ---- PIN screen ---- */
    .pin-wrap { max-width:360px; margin:18vh auto 0; padding:0 24px; text-align:center; }
    .pin-wrap h2 { font-size:19px; margin-bottom:18px; }
    .pin-wrap input { width:100%; text-align:center; letter-spacing:10px; font-size:26px; font-weight:800;
      font-family:inherit; border:1.5px solid var(--line); border-radius:14px; padding:16px; background:var(--card);
      color:var(--ink); }
    .pin-wrap input:focus { outline:none; border-color:var(--blue); }
    .pin-wrap button { width:100%; margin-top:14px; background:var(--blue); color:#fff; border:none; border-radius:14px;
      padding:15px; font-family:inherit; font-weight:800; font-size:16px; cursor:pointer; }
    .pin-err { color:var(--cancel); font-size:13px; font-weight:700; margin-top:10px; display:none; }

    /* ---- Section tabs (orders / menu) ---- */
    #dash { display:none; }
    .toptabs { display:flex; gap:8px; padding:14px 16px 4px; margin-top:-18px; }
    .toptabs button { flex:1; background:var(--card); border:1px solid var(--line); color:var(--muted); font-family:inherit;
      font-weight:800; font-size:14px; padding:12px; border-radius:14px; cursor:pointer; box-shadow:var(--shadow); }
    .toptabs button.active { background:var(--blue); color:#fff; border-color:var(--blue); }

    /* ---- Orders tab ---- */
    .stats { display:flex; gap:10px; padding:14px 16px; }
    .stat { flex:1; background:var(--card); border-radius:16px; padding:14px; box-shadow:var(--shadow); text-align:center; }
    .stat b { display:block; font-size:22px; color:var(--blue); }
    .stat small { color:var(--muted); font-size:12px; font-weight:700; }
    .listwrap { padding:0 16px; }
    .order { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px;
      box-shadow:var(--shadow); }
    .order.cancelled { opacity:.5; }
    .order .row1 { display:flex; justify-content:space-between; align-items:center; font-weight:800; font-size:15px; }
    .order .tbl { color:var(--blue); }
    .order .time { color:var(--muted); font-size:12.5px; font-weight:600; }
    .order .items { margin:8px 0; font-size:14px; color:var(--ink); line-height:1.6; }
    .order .row2 { display:flex; justify-content:space-between; align-items:center; margin-top:4px; }
    .order .total { color:var(--gold); font-weight:800; font-size:16px; }
    .order .cancel-btn { background:#fff; border:1.5px solid var(--cancel); color:var(--cancel); font-family:inherit;
      font-weight:700; font-size:13px; padding:7px 14px; border-radius:10px; cursor:pointer; }
    .order .cancel-btn:active { transform:scale(.96); }
    .order .status-chip { font-size:12px; font-weight:800; padding:4px 10px; border-radius:999px; }
    .status-chip.cancelled { background:#fbe5e5; color:var(--cancel); }
    .empty { text-align:center; color:var(--muted); padding:60px 16px; font-weight:600; }
    .refresh-note { text-align:center; color:var(--muted); font-size:12px; padding:10px; }

    /* ---- Menu tab ---- */
    .nav { position:sticky; top:0; z-index:8; background:var(--bg); display:flex; gap:8px; padding:12px 16px;
      overflow-x:auto; box-shadow:0 6px 12px -10px rgba(0,0,0,.2); }
    .nav::-webkit-scrollbar { display:none; }
    .nav button { flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--muted); font-family:inherit;
      font-weight:700; font-size:14px; padding:9px 16px; border-radius:999px; cursor:pointer; }
    .nav button.active { background:var(--blue); color:#fff; border-color:var(--blue); }

    .cat { padding:14px 16px 2px; }
    .cat h2 { font-size:15px; color:var(--blue); margin:0 0 12px; font-weight:800; display:flex; align-items:center; gap:8px; }
    .cat h2::before { content:''; width:5px; height:18px; background:var(--gold); border-radius:3px; }

    .mitem { background:var(--card); border:1px solid var(--line); border-radius:16px; margin-bottom:10px; padding:13px 14px;
      display:flex; align-items:center; justify-content:space-between; gap:10px; box-shadow:var(--shadow); }
    .mitem.off { opacity:.6; }
    .minfo { min-width:0; }
    .mname { font-weight:700; font-size:16px; }
    .mprice { color:var(--gold); font-size:13px; font-weight:700; margin-top:3px; }
    .mprice s { color:var(--muted); font-weight:500; text-decoration-color:var(--muted); margin-left:4px; }
    .mactions { display:flex; align-items:center; gap:8px; flex:0 0 auto; }
    .medit, .moffer { width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:#fff; font-size:16px;
      display:grid; place-items:center; cursor:pointer; }
    .medit:active, .moffer:active { transform:scale(.92); }
    .moffer.on { background:var(--gold); border-color:var(--gold); }
    .mstock { border:none; border-radius:999px; padding:9px 14px; font-family:inherit; font-weight:800; font-size:13px;
      cursor:pointer; white-space:nowrap; color:#fff; min-width:64px; }
    .mstock.on { background:var(--ok); }
    .mstock.off { background:var(--cancel); }
    .mstock:disabled { opacity:.5; cursor:default; }

    .fab { position:fixed; left:16px; bottom:16px; z-index:9; background:var(--gold); color:#fff; border:none;
      border-radius:16px; padding:15px 22px; font-family:inherit; font-weight:800; font-size:15px; cursor:pointer;
      box-shadow:0 10px 28px rgba(192,140,35,.4); align-items:center; gap:8px; }
    .fab:active { transform:scale(.97); }

    .scrim { position:fixed; inset:0; background:rgba(12,24,48,.55); z-index:20; opacity:0; pointer-events:none; transition:opacity .25s ease; }
    .scrim.show { opacity:1; pointer-events:auto; }
    .sheet { position:fixed; left:0; right:0; bottom:0; z-index:21; background:var(--card); border-top-left-radius:24px;
      border-top-right-radius:24px; padding:18px 18px calc(20px + env(safe-area-inset-bottom)); transform:translateY(120%);
      transition:transform .2s cubic-bezier(.2,.9,.2,1); box-shadow:var(--shadow-lg); max-height:85vh; max-height:85dvh;
      overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .sheet.show { transform:translateY(0); }
    .sheet .x-btn { position:absolute; top:14px; left:14px; width:34px; height:34px; border-radius:50%; background:var(--bg);
      border:1px solid var(--line); font-size:17px; color:var(--ink); display:grid; place-items:center; cursor:pointer; }
    .sheet .title { font-size:19px; font-weight:800; margin:4px 0 18px; }
    .field { margin-bottom:14px; }
    .field label { display:block; font-size:13px; color:var(--muted); font-weight:700; margin-bottom:7px; }
    .field input, .field select { width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px;
      font-family:inherit; font-size:15px; color:var(--ink); background:#fff; }
    .field input:focus, .field select:focus { outline:none; border-color:var(--blue); }
    .variant-row { display:flex; gap:10px; }
    .variant-row .field { flex:1; }
    .check-row { display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:14px; font-weight:700; }
    .check-row input { width:auto; }
    .save-btn { width:100%; background:var(--gold); color:#fff; border:none; border-radius:14px; padding:15px;
      font-family:inherit; font-weight:800; font-size:16px; cursor:pointer; margin-top:4px; }
    .save-btn:disabled { opacity:.6; }
    .loading { text-align:center; color:var(--muted); padding:60px 16px; font-weight:600; }
  </style>
</head>
<body>
  <div class="demoflag" id="demoFlag" style="display:none">وضع العرض — بيانات تجريبية، مش طلبات حقيقية</div>

  <div class="pin-wrap" id="pinScreen">
    <h2 id="pinTitle">لوحة الإدارة</h2>
    <input id="pinInput" inputmode="numeric" maxlength="6" placeholder="••••" autofocus />
    <button onclick="tryPin()">دخول</button>
    <div class="pin-err" id="pinErr">الرقم غلط، جرب تاني</div>
  </div>

  <div id="dash">
    <div class="hero">
      <div class="cafe" id="cafeName">…</div>
      <div class="sub" id="heroSub">لوحة الإدارة — الطلبات والإجمالي</div>
    </div>

    <div class="toptabs">
      <button id="tabOrdersBtn" class="active" onclick="switchTab('orders')">الطلبات</button>
      <button id="tabMenuBtn" style="display:none" onclick="switchTab('menu')">المنيو</button>
    </div>

    <div id="ordersSection">
      <div class="stats">
        <div class="stat"><b id="statCount">0</b><small>عدد الطلبات</small></div>
        <div class="stat"><b id="statTotal">0</b><small>الإجمالي المتوقع</small></div>
      </div>
      <div class="listwrap" id="ordersList"></div>
      <div class="refresh-note" id="refreshNote"></div>
    </div>

    <div id="menuSection" style="display:none">
      <nav class="nav" id="nav"></nav>
      <main id="menuList"><div class="loading">جاري تحميل المنيو…</div></main>
    </div>
  </div>

  <button class="fab" id="fab" style="display:none" onclick="openAdd()">+ طبق جديد</button>

  <div class="scrim" id="scrim" onclick="closeSheets()"></div>

  <div class="sheet" id="editSheet">
    <button class="x-btn" onclick="closeSheets()" aria-label="إغلاق">✕</button>
    <div class="title">تعديل الطبق</div>
    <div class="field"><label>الاسم</label><input id="editName" /></div>
    <div id="editPrices"></div>
    <button class="save-btn" id="editSave" onclick="saveEdit()">حفظ</button>
  </div>

  <div class="sheet" id="addSheet">
    <button class="x-btn" onclick="closeSheets()" aria-label="إغلاق">✕</button>
    <div class="title">طبق جديد</div>
    <div class="field"><label>الاسم</label><input id="addName" placeholder="مثلاً: فرابيه بستاشيو" /></div>
    <div class="field">
      <label>الفئة</label>
      <select id="addCatSelect"></select>
    </div>
    <div class="field"><label>أو اكتب فئة جديدة</label><input id="addCatNew" placeholder="سيبها فاضية لو هتختار من فوق" /></div>
    <div class="check-row">
      <input type="checkbox" id="addHasVariants" onchange="toggleAddVariants()" />
      <label for="addHasVariants">عنده أكتر من مقاس (زي صغير/كبير)؟</label>
    </div>
    <div id="addFlatPrice" class="field"><label>السعر</label><input id="addPrice" type="number" inputmode="decimal" /></div>
    <div id="addVariants" style="display:none">
      <div class="variant-row">
        <div class="field"><label>مقاس 1</label><input id="addV1Name" value="صغير" /></div>
        <div class="field"><label>السعر</label><input id="addV1Price" type="number" inputmode="decimal" /></div>
      </div>
      <div class="variant-row">
        <div class="field"><label>مقاس 2</label><input id="addV2Name" value="كبير" /></div>
        <div class="field"><label>السعر</label><input id="addV2Price" type="number" inputmode="decimal" /></div>
      </div>
    </div>
    <button class="save-btn" id="addSave" onclick="saveAdd()">إضافة</button>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const CLIENT = params.get("c") || "elbob";
    const initialTab = params.get("tab") === "menu" ? "menu" : "orders";
    let CFG = {}, CUR = "ج", LIVE = false, hasMenu = false, POLL = null;
    let mockOrders = [];
    let ordersStarted = false, menuLoaded = false;
    let state = { items: [], catOrder: [] };
    let editingId = null;

    function reveal() { document.body.classList.add("ready"); }
    setTimeout(reveal, 2500); // safety net -- never leave the page permanently blank

    fetch(`clients/${CLIENT}.json`).then(r => r.json()).then(boot).catch(() => {
      document.getElementById("pinTitle").textContent = "تعذر تحميل الإعدادات";
      reveal();
    });

    function boot(cfg) {
      CFG = cfg; CUR = cfg.currency || "ج";
      if (cfg.theme) {
        const t = cfg.theme, root = document.documentElement.style;
        if (t.blue) root.setProperty('--blue', t.blue);
        if (t.blue2) root.setProperty('--blue-2', t.blue2);
        if (t.gold) root.setProperty('--gold', t.gold);
        if (t.gold2) root.setProperty('--gold-2', t.gold2);
        if (t.bg) root.setProperty('--bg', t.bg);
      }
      const cleanName = (cfg.name_ar || "وقتي").replace(/<[^>]+>/g, '');
      document.getElementById("cafeName").innerHTML = cfg.name_ar || "وقتي";
      document.getElementById("pinTitle").textContent = cleanName + " — لوحة الإدارة";
      document.title = "لوحة الإدارة — " + cleanName;
      LIVE = !!cfg.admin_webhook;
      hasMenu = !!cfg.price_sheet_api;
      document.getElementById("tabMenuBtn").style.display = hasMenu ? "block" : "none";
      document.getElementById("pinInput").addEventListener("keydown", e => { if (e.key === "Enter") tryPin(); });
      reveal();
    }

    function tryPin() {
      const val = document.getElementById("pinInput").value.trim();
      if (!CFG.admin_pin || val !== String(CFG.admin_pin)) {
        document.getElementById("pinErr").style.display = "block";
        return;
      }
      document.getElementById("pinScreen").style.display = "none";
      document.getElementById("dash").style.display = "block";
      switchTab(initialTab === "menu" && hasMenu ? "menu" : "orders");
    }

    // ---------- Section tabs ----------
    function switchTab(tab) {
      document.getElementById("tabOrdersBtn").classList.toggle("active", tab === "orders");
      document.getElementById("tabMenuBtn").classList.toggle("active", tab === "menu");
      document.getElementById("ordersSection").style.display = tab === "orders" ? "block" : "none";
      document.getElementById("menuSection").style.display = tab === "menu" ? "block" : "none";
      document.getElementById("fab").style.display = (tab === "menu" && hasMenu) ? "flex" : "none";
      document.getElementById("heroSub").textContent = tab === "menu"
        ? "إدارة المنيو — الأسعار والتوفر" : "لوحة الإدارة — الطلبات والإجمالي";
      document.getElementById("demoFlag").style.display = (tab === "orders" && !LIVE) ? "block" : "none";

      if (tab === "orders" && !ordersStarted) {
        ordersStarted = true;
        if (!LIVE) {
          document.getElementById("refreshNote").textContent = "بيانات تجريبية — هتتبدل بطلبات حقيقية أول ما النظام يشتغل فعلياً";
          seedMockOrders();
          renderMock();
        } else {
          document.getElementById("refreshNote").textContent = "بيتحدث كل 15 ثانية";
          refreshLive();
          POLL = setInterval(refreshLive, 15000);
        }
      }
      if (tab === "menu" && hasMenu && !menuLoaded) {
        menuLoaded = true;
        loadMenu();
      }
    }

    // ---------- Orders tab: live mode (real Apps Script) ----------
    function refreshLive() {
      const url = `${CFG.admin_webhook}?action=list&key=${encodeURIComponent(CFG.admin_key || "")}`;
      fetch(url).then(r => r.json()).then(data => {
        if (data.error) { document.getElementById("refreshNote").textContent = "خطأ: " + data.error; return; }
        renderOrders(data.orders, data.expected_cash, cancelLive);
      }).catch(() => { document.getElementById("refreshNote").textContent = "تعذر الاتصال — هيحاول تاني"; });
    }
    function cancelLive(id) {
      const url = `${CFG.admin_webhook}?action=cancel&id=${encodeURIComponent(id)}&key=${encodeURIComponent(CFG.admin_key || "")}`;
      fetch(url).then(r => r.json()).then(() => refreshLive())
        .catch(() => alert("تعذر إلغاء الطلب — حاول تاني"));
    }

    // ---------- Orders tab: demo mode (mock data, no backend) ----------
    function seedMockOrders() {
      const now = Date.now();
      const sample = [
        { table: "2", items: "1× فرابيه فانيليا، 1× ميلك شيك أوريو", total: 115 },
        { table: "5", items: "2× موهيتو فراولة", total: 110 },
        { table: "1", items: "1× وافل لوتس، 1× عصير مانجو", total: 115 },
        { table: "3", items: "1× آيس كريم فروله (كبير)", total: 20 },
        { table: "4", items: "1× سموزي بلوبيري، 1× كريب أوريو", total: 120 },
        { table: "2", items: "1× ميلك شيك سكويز سبيشل", total: 90 },
        { table: "6", items: "3× شاي، 1× سحلب بالمكسرات", total: 80 },
      ];
      mockOrders = sample.map((o, i) => ({
        id: "demo" + i, table: o.table, items: o.items, total: o.total, status: "new",
        time: new Date(now - (sample.length - i) * 11 * 60000).toTimeString().slice(0, 5)
      }));
    }
    function renderMock() {
      const total = mockOrders.filter(o => o.status !== "cancelled").reduce((s, o) => s + o.total, 0);
      renderOrders(mockOrders, total, (id) => {
        const o = mockOrders.find(x => x.id === id);
        if (o) o.status = "cancelled";
        renderMock();
      });
    }

    // ---------- Orders tab: shared render ----------
    // o.table and o.items both trace back to customer input (table via the page's own
    // ?table= URL param, items via the order note's free text) -- escape before innerHTML,
    // the same way index.html already does for its own cart-note preview. Without this, a
    // note like "<img src=x onerror=...>" gets stored verbatim in the Orders sheet and
    // executes here, inside the PIN-gated dashboard, the next time it's opened.
    const esc = s => String(s).replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));

    // Orders written since the 2026-10-10 receipts overhaul store `items` as a JSON array
    // (name/qty/price per line) instead of a flattened display string -- lets the owner see
    // a price per line here too, same as the printed cashier copy. Orders from before that
    // (still sitting in the real Sheet from the pilot period) are a plain string -- fall
    // back to showing that as-is rather than crashing on JSON.parse.
    function itemsLabel(raw) {
      try {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) {
          return parsed.map(i => `${esc(i.qty)}× ${esc(i.name)} — ${esc(i.price * i.qty)} ${CUR}`).join("<br>");
        }
      } catch (e) {}
      return esc(raw); // legacy plain-string order, pre-dating the JSON format
    }

    function renderOrders(orders, total, onCancel) {
      const activeCount = orders.filter(o => o.status !== "cancelled").length;
      document.getElementById("statCount").textContent = activeCount;
      document.getElementById("statTotal").textContent = total + " " + CUR;
      const box = document.getElementById("ordersList");
      if (!orders.length) { box.innerHTML = '<div class="empty">لسه مفيش طلبات النهاردة</div>'; return; }
      box.innerHTML = "";
      [...orders].reverse().forEach(o => {
        const cancelled = o.status === "cancelled";
        const el = document.createElement("div");
        el.className = "order" + (cancelled ? " cancelled" : "");
        el.innerHTML = `
          <div class="row1"><span class="tbl">ترابيزة ${esc(o.table)}</span><span class="time">${o.time}</span></div>
          <div class="items">${itemsLabel(o.items)}</div>
          <div class="row2">
            <span class="total">${o.total} ${CUR}</span>
            ${cancelled ? '<span class="status-chip cancelled">ملغي</span>' : `<button class="cancel-btn" data-id="${o.id}">إلغاء الطلب</button>`}
          </div>`;
        if (!cancelled) el.querySelector(".cancel-btn").onclick = () => {
          if (confirm("تأكيد إلغاء طلب ترابيزة " + o.table + "؟")) onCancel(o.id);
        };
        box.appendChild(el);
      });
    }

    // ---------- Menu tab: load + group the Menu sheet (this IS the full catalog -- every
    // item was seeded into it already, so unlike index.html's merge there's no JSON fallback
    // needed here for display purposes) ----------
    function loadMenu() {
      fetch(`${CFG.price_sheet_api}?action=menu`).then(r => r.json()).then(data => {
        state = groupRows((data && data.rows) || []);
        renderMenu();
      }).catch(() => {
        document.getElementById("menuList").innerHTML = '<div class="loading">تعذر تحميل المنيو — اقفل الصفحة وافتحها تاني</div>';
      });
    }

    function groupRows(rows) {
      const byId = {};
      rows.forEach(r => {
        const id = String(r.item_id || "").trim();
        if (!id) return;
        (byId[id] = byId[id] || []).push(r);
      });
      const catOrder = [];
      const items = Object.keys(byId).map(id => {
        const itemRows = byId[id];
        const category = (itemRows[0].category || "").trim() || "إضافات";
        if (!catOrder.includes(category)) catOrder.push(category);
        const active = itemRows.every(r => String(r.active).trim().toUpperCase() !== "FALSE");
        const variantRows = itemRows.filter(r => String(r.variant || "").trim() !== "");
        const flatRow = itemRows.find(r => String(r.variant || "").trim() === "") || itemRows[0];
        const offerFields = (r) => ({
          salePrice: (r.sale_price_egp === "" || r.sale_price_egp == null) ? null : Number(r.sale_price_egp),
          onOffer: String(r.on_offer || "").trim().toUpperCase() === "TRUE",
        });
        return {
          id, category, name_ar: itemRows[0].name_ar, active,
          variants: variantRows.length
            ? variantRows.map(r => ({ name: String(r.variant).trim(), price: Number(r.price_egp), ...offerFields(r) }))
            : null,
          price: variantRows.length ? null : Number(flatRow.price_egp),
          ...(variantRows.length ? {} : offerFields(flatRow)),
        };
      });
      return { items, catOrder };
    }

    // "On offer" means EVERY row has both a configured discount price and the toggle on --
    // a multi-variant item toggles both sizes together (same pattern as the stock pill), so
    // a half-on state should never actually happen, but checking "every" rather than "some"
    // means the badge never claims a deal that isn't fully active on all sizes.
    function offerOn(it) {
      return it.variants ? it.variants.every(v => v.onOffer) : !!it.onOffer;
    }
    function offerConfigured(it) {
      return it.variants ? it.variants.every(v => v.salePrice != null) : it.salePrice != null;
    }

    function priceLabel(it) {
      if (it.variants) {
        const label = it.variants.map(v => `${v.name} ${offerOn(v) ? v.salePrice : v.price}`).join(" · ") + " " + CUR;
        return (offerOn(it) ? "🏷️ " : "") + label;
      }
      if (offerOn(it)) return `<s>${it.price}</s> ${it.salePrice} ${CUR} 🏷️`;
      return it.price + " " + CUR;
    }

    function renderMenu() {
      const nav = document.getElementById("nav"); nav.innerHTML = "";
      const list = document.getElementById("menuList"); list.innerHTML = "";
      if (!state.items.length) { list.innerHTML = '<div class="loading">لسه مفيش أصناف</div>'; return; }
      state.catOrder.forEach((cat, ci) => {
        const catItems = state.items.filter(i => i.category === cat);
        if (!catItems.length) return;
        const btn = document.createElement("button");
        btn.textContent = cat; if (ci === 0) btn.className = "active";
        btn.onclick = () => document.getElementById("cat-" + ci).scrollIntoView({ behavior: "smooth", block: "start" });
        nav.appendChild(btn);

        const sec = document.createElement("section");
        sec.className = "cat"; sec.id = "cat-" + ci;
        sec.innerHTML = `<h2>${cat}</h2>`;
        catItems.forEach(it => sec.appendChild(itemCard(it)));
        list.appendChild(sec);
      });
    }

    function itemCard(it) {
      const card = document.createElement("div");
      card.className = "mitem" + (it.active ? "" : " off");
      card.innerHTML = `
        <div class="minfo">
          <div class="mname">${it.name_ar}</div>
          <div class="mprice">${priceLabel(it)}</div>
        </div>
        <div class="mactions">
          <button class="moffer ${offerOn(it) ? "on" : ""}" title="عرض">🏷️</button>
          <button class="medit" title="تعديل">✏️</button>
          <button class="mstock ${it.active ? "on" : "off"}" ${it._busy ? "disabled" : ""}>${it._busy ? "…" : (it.active ? "متوفر" : "خلصت")}</button>
        </div>`;
      card.querySelector(".moffer").onclick = () => toggleOffer(it.id);
      card.querySelector(".medit").onclick = () => openEdit(it.id);
      card.querySelector(".mstock").onclick = () => toggleStock(it.id);
      return card;
    }

    // Tapping the offer pill: if no discount price is configured yet, open the edit sheet
    // so she can set one (saving it there turns the offer on automatically -- see saveEdit).
    // If a price IS already configured, this is a plain on/off toggle, same pattern as stock.
    function toggleOffer(id) {
      const it = state.items.find(i => i.id === id);
      if (!it || it._busy) return;
      if (!offerConfigured(it)) { openEdit(id); return; }
      const newOn = !offerOn(it);
      it._busy = true; renderMenu();
      const writes = rowsForItem(it).map(r => {
        const sale = it.variants ? it.variants.find(v => v.name === r.variant).salePrice : it.salePrice;
        return menuSet({
          item_id: id, category: it.category, name_ar: it.name_ar,
          variant: r.variant, price_egp: r.price, active: String(it.active),
          sale_price_egp: sale, on_offer: String(newOn),
        });
      });
      Promise.all(writes).then(results => {
        if (results.every(r => r && r.ok)) {
          if (it.variants) it.variants.forEach(v => { v.onOffer = newOn; });
          else it.onOffer = newOn;
        } else alert("حصل خطأ — حاول تاني");
      }).catch(() => alert("تعذر الاتصال — حاول تاني"))
        .finally(() => { it._busy = false; renderMenu(); });
    }

    function rowsForItem(it) {
      return it.variants ? it.variants.map(v => ({ variant: v.name, price: v.price })) : [{ variant: "", price: it.price }];
    }

    // GET, not POST -- a POST with Content-Type:application/json triggers a CORS preflight
    // (OPTIONS) that Apps Script Web Apps don't handle, same reason index.html's sendOrder
    // uses text/plain for Squeeze. GET is a CORS-safe "simple request," no preflight at all.
    function menuSet(fields) {
      const qs = new URLSearchParams(Object.assign({ action: "menu_set", key: CFG.admin_key || "" }, fields));
      return fetch(`${CFG.price_sheet_api}?${qs.toString()}`).then(r => r.json());
    }

    function toggleStock(id) {
      const it = state.items.find(i => i.id === id);
      if (!it || it._busy) return;
      const newActive = !it.active;
      it._busy = true; renderMenu();
      // menuSet upserts the WHOLE row server-side, not a partial patch -- any configured
      // offer (sale_price_egp/on_offer) must be resent here too, or toggling stock would
      // silently wipe it.
      const writes = rowsForItem(it).map(r => {
        const v = it.variants ? it.variants.find(x => x.name === r.variant) : it;
        return menuSet({
          item_id: id, category: it.category, name_ar: it.name_ar,
          variant: r.variant, price_egp: r.price, active: String(newActive),
          sale_price_egp: v.salePrice == null ? '' : v.salePrice, on_offer: String(!!v.onOffer),
        });
      });
      Promise.all(writes).then(results => {
        if (results.every(r => r && r.ok)) it.active = newActive;
        else alert("حصل خطأ — حاول تاني");
      }).catch(() => alert("تعذر الاتصال — حاول تاني"))
        .finally(() => { it._busy = false; renderMenu(); });
    }

    // ---------- Edit existing item (name + price + optional discount price -- not variant
    // labels/sizes) ----------
    function openEdit(id) {
      editingId = id;
      const it = state.items.find(i => i.id === id);
      document.getElementById("editName").value = it.name_ar;
      const box = document.getElementById("editPrices"); box.innerHTML = "";
      if (it.variants) {
        it.variants.forEach(v => {
          const row = document.createElement("div");
          row.className = "field";
          row.innerHTML = `<label>السعر — ${v.name}</label><input type="number" inputmode="decimal" class="edit-variant-price" data-name="${v.name}" value="${v.price}" />`;
          box.appendChild(row);
          const saleRow = document.createElement("div");
          saleRow.className = "field";
          saleRow.innerHTML = `<label>سعر العرض — ${v.name} (اختياري)</label>
            <input type="number" inputmode="decimal" class="edit-variant-sale" data-name="${v.name}" value="${v.salePrice != null ? v.salePrice : ''}" placeholder="سيبه فاضي لو مفيش عرض" />`;
          box.appendChild(saleRow);
        });
      } else {
        box.innerHTML = `
          <div class="field"><label>السعر</label><input type="number" inputmode="decimal" id="editFlatPrice" value="${it.price}" /></div>
          <div class="field"><label>سعر العرض (اختياري)</label>
            <input type="number" inputmode="decimal" id="editFlatSale" value="${it.salePrice != null ? it.salePrice : ''}" placeholder="سيبه فاضي لو مفيش عرض" /></div>`;
      }
      openSheet("editSheet");
    }

    function saveEdit() {
      const it = state.items.find(i => i.id === editingId);
      if (!it) return;
      const name = document.getElementById("editName").value.trim();
      if (!name) { alert("اكتب اسم الصنف"); return; }

      // salePrice null = no discount configured for that row. Validated the same as the
      // regular price when present, but it's always optional.
      let rows;
      if (it.variants) {
        rows = []; let bad = false;
        document.querySelectorAll(".edit-variant-price").forEach(inp => {
          const price = Number(inp.value);
          if (inp.value === "" || isNaN(price) || price < 0) bad = true;
          const saleInp = document.querySelector(`.edit-variant-sale[data-name="${inp.dataset.name}"]`);
          const saleRaw = (saleInp ? saleInp.value : "").trim();
          const salePrice = saleRaw === "" ? null : Number(saleRaw);
          if (salePrice != null && (isNaN(salePrice) || salePrice < 0)) bad = true;
          rows.push({ variant: inp.dataset.name, price, salePrice });
        });
        if (bad) { alert("تأكد إن كل الأسعار أرقام صح"); return; }
      } else {
        const raw = document.getElementById("editFlatPrice").value;
        const price = Number(raw);
        if (raw === "" || isNaN(price) || price < 0) { alert("السعر لازم يكون رقم"); return; }
        const saleRaw = document.getElementById("editFlatSale").value.trim();
        const salePrice = saleRaw === "" ? null : Number(saleRaw);
        if (salePrice != null && (isNaN(salePrice) || salePrice < 0)) { alert("سعر العرض لازم يكون رقم"); return; }
        rows = [{ variant: "", price, salePrice }];
      }

      // on_offer isn't touched by a normal edit -- UNLESS the discount price just got set
      // for the very first time (she clearly wants it active right away, same as tapping
      // the offer pill immediately after), or just got cleared back to empty (can't stay
      // "on offer" with no price).
      const hadPriceBefore = offerConfigured(it);
      const hasPriceNow = rows.every(r => r.salePrice != null);
      const wasOn = offerOn(it);
      const newOn = !hasPriceNow ? false : (!hadPriceBefore ? true : wasOn);

      const btn = document.getElementById("editSave"); btn.disabled = true; btn.textContent = "جاري الحفظ…";
      Promise.all(rows.map(r => menuSet({
        item_id: it.id, category: it.category, name_ar: name,
        variant: r.variant, price_egp: r.price, active: String(it.active),
        sale_price_egp: r.salePrice == null ? '' : r.salePrice, on_offer: String(newOn),
      }))).then(results => {
        if (!results.every(r => r && r.ok)) throw new Error("save_failed");
        it.name_ar = name;
        if (it.variants) it.variants.forEach(v => {
          const r = rows.find(x => x.variant === v.name);
          if (r) { v.price = r.price; v.salePrice = r.salePrice; v.onOffer = newOn; }
        });
        else { it.price = rows[0].price; it.salePrice = rows[0].salePrice; it.onOffer = newOn; }
        closeSheets(); renderMenu();
      }).catch(() => alert("حصل خطأ في الحفظ — حاول تاني"))
        .finally(() => { btn.disabled = false; btn.textContent = "حفظ"; });
    }

    // ---------- Add new item ----------
    function openAdd() {
      document.getElementById("addName").value = "";
      document.getElementById("addPrice").value = "";
      document.getElementById("addCatNew").value = "";
      document.getElementById("addHasVariants").checked = false;
      document.getElementById("addV1Name").value = "صغير"; document.getElementById("addV1Price").value = "";
      document.getElementById("addV2Name").value = "كبير"; document.getElementById("addV2Price").value = "";
      toggleAddVariants();
      const sel = document.getElementById("addCatSelect"); sel.innerHTML = "";
      state.catOrder.forEach(cat => {
        const opt = document.createElement("option"); opt.value = cat; opt.textContent = cat; sel.appendChild(opt);
      });
      openSheet("addSheet");
    }

    function toggleAddVariants() {
      const on = document.getElementById("addHasVariants").checked;
      document.getElementById("addFlatPrice").style.display = on ? "none" : "block";
      document.getElementById("addVariants").style.display = on ? "block" : "none";
    }

    function saveAdd() {
      const name = document.getElementById("addName").value.trim();
      const catNew = document.getElementById("addCatNew").value.trim();
      const catSel = document.getElementById("addCatSelect").value;
      const category = catNew || catSel;
      if (!name) { alert("اكتب اسم الصنف"); return; }
      if (!category) { alert("اختار فئة أو اكتب فئة جديدة"); return; }

      const hasVariants = document.getElementById("addHasVariants").checked;
      let rows;
      if (hasVariants) {
        const v1n = document.getElementById("addV1Name").value.trim(), v1pRaw = document.getElementById("addV1Price").value;
        const v2n = document.getElementById("addV2Name").value.trim(), v2pRaw = document.getElementById("addV2Price").value;
        const v1p = Number(v1pRaw), v2p = Number(v2pRaw);
        if (!v1n || !v2n || v1pRaw === "" || v2pRaw === "" || isNaN(v1p) || isNaN(v2p) || v1p < 0 || v2p < 0) {
          alert("اكتب اسم وسعر صح لكل مقاس"); return;
        }
        rows = [{ variant: v1n, price: v1p }, { variant: v2n, price: v2p }];
      } else {
        const raw = document.getElementById("addPrice").value;
        const price = Number(raw);
        if (raw === "" || isNaN(price) || price < 0) { alert("السعر لازم يكون رقم"); return; }
        rows = [{ variant: "", price }];
      }

      // One id generated client-side and reused across all variant rows of this new item --
      // if each row asked the server to auto-generate its own id, a 2-variant new item
      // would come back as two UNRELATED items instead of one item with two sizes.
      const id = "new_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const btn = document.getElementById("addSave"); btn.disabled = true; btn.textContent = "جاري الإضافة…";
      Promise.all(rows.map(r => menuSet({
        item_id: id, category, name_ar: name, variant: r.variant, price_egp: r.price, active: "true",
      }))).then(results => {
        if (!results.every(r => r && r.ok)) throw new Error("save_failed");
        closeSheets();
        loadMenu(); // refetch rather than reconstruct locally -- simplest way to pick up a new category correctly
      }).catch(() => alert("حصل خطأ في الإضافة — حاول تاني"))
        .finally(() => { btn.disabled = false; btn.textContent = "إضافة"; });
    }

    function openSheet(id) { document.getElementById("scrim").classList.add("show"); document.getElementById(id).classList.add("show"); }
    function closeSheets() {
      document.getElementById("scrim").classList.remove("show");
      document.getElementById("editSheet").classList.remove("show");
      document.getElementById("addSheet").classList.remove("show");
    }
  </script>
</body>
</html>
