<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>لوحة الإدارة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue:#0E2856; --blue-2:#173a72; --gold:#C08C23; --gold-2:#E3B85A;
      --bg:#F4EFE6; --card:#FFFFFF; --ink:#181410; --muted:#8C8475; --line:#ECE4D6;
      --shadow:0 6px 24px rgba(14,40,86,.08); --shadow-lg:0 16px 48px rgba(14,40,86,.16);
      --ok:#2E9E5B; --cancel:#C23B3B;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; }
    /* Hidden until the client's real theme is applied -- see index.html for why. */
    body:not(.ready) { visibility:hidden; }
    body { font-family:'Cairo',sans-serif; background:var(--bg); color:var(--ink); padding-bottom:94px; -webkit-font-smoothing:antialiased; }
    .demoflag { background:#ffce5c; color:#5b4300; text-align:center; font-weight:800; font-size:13px; padding:6px; }
    .hero { background:linear-gradient(135deg,var(--blue) 0%,var(--blue-2) 100%); color:#fff;
      padding:22px 20px 26px; border-bottom-left-radius:26px; border-bottom-right-radius:26px; }
    .hero .cafe { font-size:22px; font-weight:800; }
    .hero .sub { margin-top:4px; font-size:13px; color:rgba(255,255,255,.75); font-weight:600; }

    /* ---- PIN screen ---- */
    .pin-wrap { max-width:360px; margin:18vh auto 0; padding:0 24px; text-align:center; }
    .pin-wrap h2 { font-size:19px; margin-bottom:18px; }
    .pin-wrap input { width:100%; text-align:center; letter-spacing:10px; font-size:26px; font-weight:800;
      font-family:inherit; border:1.5px solid var(--line); border-radius:14px; padding:16px; background:var(--card);
      color:var(--ink); }
    .pin-wrap input:focus { outline:none; border-color:var(--blue); }
    .pin-wrap button { width:100%; margin-top:14px; background:var(--blue); color:#fff; border:none; border-radius:14px;
      padding:15px; font-family:inherit; font-weight:800; font-size:16px; cursor:pointer; }
    .pin-err { color:var(--cancel); font-size:13px; font-weight:700; margin-top:10px; display:none; }

    /* ---- Section tabs (orders / menu) ---- */
    #dash { display:none; }
    .toptabs { display:flex; gap:8px; padding:14px 16px 4px; margin-top:-18px; }
    .toptabs button { flex:1; background:var(--card); border:1px solid var(--line); color:var(--muted); font-family:inherit;
      font-weight:800; font-size:14px; padding:12px; border-radius:14px; cursor:pointer; box-shadow:var(--shadow); }
    .toptabs button.active { background:var(--blue); color:#fff; border-color:var(--blue); }

    /* ---- Orders tab ---- */
    .stats { display:flex; gap:10px; padding:14px 16px; }
    .stat { flex:1; background:var(--card); border-radius:16px; padding:14px; box-shadow:var(--shadow); text-align:center; }
    .stat b { display:block; font-size:22px; color:var(--blue); }
    .stat small { color:var(--muted); font-size:12px; font-weight:700; }
    /* Item name + count can run long (unlike the plain numbers in the other stat boxes) --
       smaller font + wrap instead of overflowing the narrow mobile card. */
    .stat b#statBestSeller { font-size:14px; white-space:normal; line-height:1.3; }
    .listwrap { padding:0 16px; }

    /* ---- History tab ---- */
    .histpicker { display:flex; flex-wrap:wrap; gap:8px; padding:14px 16px; }
    .histpicker input[type=date] { flex:1; min-width:0; border:1.5px solid var(--line); border-radius:12px;
      padding:10px 12px; font-family:inherit; font-size:14px; color:var(--ink); background:#fff; }
    .histpicker button { flex:0 0 auto; background:var(--blue); color:#fff; border:none; border-radius:12px;
      padding:10px 18px; font-family:inherit; font-weight:800; font-size:14px; cursor:pointer; }
    .histpicker button:disabled { opacity:.5; cursor:default; }
    .histpicker .print-btn { flex:1 1 100%; background:var(--gold); }
    .hist-day .tbl { font-size:14px; }
    .order { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px;
      box-shadow:var(--shadow); }
    .order.cancelled { opacity:.5; }
    .order .row1 { display:flex; justify-content:space-between; align-items:center; font-weight:800; font-size:15px; }
    .order .tbl { color:var(--blue); }
    .order .time { color:var(--muted); font-size:12.5px; font-weight:600; }
    .order .items { margin:8px 0; font-size:14px; color:var(--ink); line-height:1.6; }
    .order .row2 { display:flex; justify-content:space-between; align-items:center; margin-top:4px; }
    .order .total { color:var(--gold); font-weight:800; font-size:16px; }
    .order .order-actions { display:flex; gap:8px; align-items:center; }
    .order .cancel-btn { background:#fff; border:1.5px solid var(--cancel); color:var(--cancel); font-family:inherit;
      font-weight:700; font-size:13px; padding:7px 14px; border-radius:10px; cursor:pointer; }
    .order .cancel-btn:active { transform:scale(.96); }
    .order .edit-btn { background:#fff; border:1.5px solid var(--blue); color:var(--blue); font-family:inherit;
      font-weight:700; font-size:13px; padding:7px 14px; border-radius:10px; cursor:pointer; }
    .order .edit-btn:active { transform:scale(.96); }
    .order .done-btn { background:var(--ok); border:1.5px solid var(--ok); color:#fff; font-family:inherit;
      font-weight:700; font-size:13px; padding:7px 14px; border-radius:10px; cursor:pointer; }
    .order .done-btn:active { transform:scale(.96); }
    .order .status-chip { font-size:12px; font-weight:800; padding:4px 10px; border-radius:999px; }
    .status-chip.cancelled { background:#fbe5e5; color:var(--cancel); }
    .status-chip.pending { background:#eef6f8; color:var(--blue); }
    .order .row3 { margin-top:8px; }
    .order .retry-btn { background:#fff3e0; border:1.5px solid #e0a030; color:#8a5a00; font-family:inherit;
      font-weight:700; font-size:12.5px; padding:7px 12px; border-radius:10px; cursor:pointer; width:100%; }
    .order .retry-btn:active { transform:scale(.97); }
    .empty { text-align:center; color:var(--muted); padding:60px 16px; font-weight:600; }
    .refresh-note { text-align:center; color:var(--muted); font-size:12px; padding:10px; }

    /* ---- Day-nav bar (Expenses + History: ◀ السابق / اليوم / التالي ▶) ---- */
    .daynav { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:14px 16px 0; }
    .daynav button { flex:0 0 auto; background:#fff; border:1.5px solid var(--line); border-radius:10px;
      padding:8px 12px; font-family:inherit; font-weight:800; font-size:13.5px; color:var(--blue); cursor:pointer; }
    .daynav button:disabled { opacity:.4; cursor:default; }
    .daynav button:active:not(:disabled) { transform:scale(.95); }
    .daynav .daylabel { font-weight:800; font-size:14px; color:var(--ink); padding:4px 8px; }
    .daynav .daylabel.jumpable { color:var(--blue); cursor:pointer; text-decoration:underline; }

    /* ---- Expenses tab (تقفيل) ---- */
    .exp-form { padding:14px 16px 0; }
    .add-item-btn { width:100%; background:#fff; border:1.5px dashed var(--line); border-radius:12px; padding:11px;
      font-family:inherit; font-weight:700; font-size:14px; color:var(--blue); cursor:pointer; margin-bottom:14px; }

    /* ---- Order edit sheet ---- */
    .oe-item-row { display:flex; gap:6px; margin-bottom:10px; align-items:center; }
    .oe-item-row input { border:1.5px solid var(--line); border-radius:10px; padding:10px; font-family:inherit;
      font-size:14px; color:var(--ink); background:#fff; min-width:0; }
    .oe-item-row input:focus { outline:none; border-color:var(--blue); }
    .oe-item-row .oe-item-name { flex:2; }
    .oe-item-row .oe-item-qty { flex:1; }
    .oe-item-row .oe-item-price { flex:1; }
    .oe-item-remove { flex:0 0 auto; width:34px; height:34px; border-radius:10px; border:1px solid var(--line);
      background:#fff; font-size:15px; cursor:pointer; }
    .oe-total { font-weight:800; font-size:17px; color:var(--gold); margin-bottom:14px; text-align:center; }

    /* ---- Cashier order sheet (embeds index.html's real menu picker) ---- */
    .sheet.sheet-frame { padding:0; max-height:88vh; max-height:88dvh; }
    .sheet.sheet-frame iframe { width:100%; height:80vh; height:80dvh; border:none; display:block;
      border-radius:24px 24px 0 0; }

    /* ---- Menu tab ---- */
    .nav { position:sticky; top:0; z-index:8; background:var(--bg); display:flex; gap:8px; padding:12px 16px;
      overflow-x:auto; box-shadow:0 6px 12px -10px rgba(0,0,0,.2); }
    .nav::-webkit-scrollbar { display:none; }
    .nav button { flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--muted); font-family:inherit;
      font-weight:700; font-size:14px; padding:9px 16px; border-radius:999px; cursor:pointer; }
    .nav button.active { background:var(--blue); color:#fff; border-color:var(--blue); }

    .cat { padding:14px 16px 2px; }
    .cat h2 { font-size:15px; color:var(--blue); margin:0 0 12px; font-weight:800; display:flex; align-items:center; gap:8px; }
    .cat h2::before { content:''; width:5px; height:18px; background:var(--gold); border-radius:3px; }

    .mitem { background:var(--card); border:1px solid var(--line); border-radius:16px; margin-bottom:10px; padding:13px 14px;
      display:flex; align-items:center; justify-content:space-between; gap:10px; box-shadow:var(--shadow); }
    .mitem.off { opacity:.6; }
    .minfo { min-width:0; }
    .mname { font-weight:700; font-size:16px; }
    .mprice { color:var(--gold); font-size:13px; font-weight:700; margin-top:3px; }
    .mprice s { color:var(--muted); font-weight:500; text-decoration-color:var(--muted); margin-left:4px; }
    .mactions { display:flex; align-items:center; gap:8px; flex:0 0 auto; }
    .medit { width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:#fff; font-size:16px;
      display:grid; place-items:center; cursor:pointer; }
    .medit:active { transform:scale(.92); }
    .moffer { border:1px solid var(--line); border-radius:999px; padding:9px 14px; background:#fff;
      font-family:inherit; font-weight:800; font-size:13px; white-space:nowrap; color:var(--ink); cursor:pointer; }
    .moffer:active { transform:scale(.92); }
    .moffer.on { background:var(--gold); border-color:var(--gold); color:#fff; }
    .mstock { border:none; border-radius:999px; padding:9px 14px; font-family:inherit; font-weight:800; font-size:13px;
      cursor:pointer; white-space:nowrap; color:#fff; min-width:64px; }
    .mstock.on { background:var(--ok); }
    .mstock.off { background:var(--cancel); }
    .mstock:disabled { opacity:.5; cursor:default; }

    .fab { position:fixed; left:16px; bottom:16px; z-index:9; background:var(--gold); color:#fff; border:none;
      border-radius:16px; padding:15px 22px; font-family:inherit; font-weight:800; font-size:15px; cursor:pointer;
      box-shadow:0 10px 28px rgba(192,140,35,.4); align-items:center; gap:8px; }
    .fab:active { transform:scale(.97); }

    .scrim { position:fixed; inset:0; background:rgba(12,24,48,.55); z-index:20; opacity:0; pointer-events:none; transition:opacity .25s ease; }
    .scrim.show { opacity:1; pointer-events:auto; }
    .sheet { position:fixed; left:0; right:0; bottom:0; z-index:21; background:var(--card); border-top-left-radius:24px;
      border-top-right-radius:24px; padding:18px 18px calc(20px + env(safe-area-inset-bottom)); transform:translateY(120%);
      transition:transform .2s cubic-bezier(.2,.9,.2,1); box-shadow:var(--shadow-lg); max-height:85vh; max-height:85dvh;
      overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .sheet.show { transform:translateY(0); }
    .sheet .x-btn { position:absolute; top:14px; left:14px; width:34px; height:34px; border-radius:50%; background:var(--bg);
      border:1px solid var(--line); font-size:17px; color:var(--ink); display:grid; place-items:center; cursor:pointer; }
    .sheet .title { font-size:19px; font-weight:800; margin:4px 0 18px; }
    .field { margin-bottom:14px; }
    .field label { display:block; font-size:13px; color:var(--muted); font-weight:700; margin-bottom:7px; }
    .field input, .field select { width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px;
      font-family:inherit; font-size:15px; color:var(--ink); background:#fff; }
    .field input:focus, .field select:focus { outline:none; border-color:var(--blue); }
    .variant-row { display:flex; gap:10px; }
    .variant-row .field { flex:1; }
    .check-row { display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:14px; font-weight:700; }
    .check-row input { width:auto; }
    .save-btn { width:100%; background:var(--gold); color:#fff; border:none; border-radius:14px; padding:15px;
      font-family:inherit; font-weight:800; font-size:16px; cursor:pointer; margin-top:4px; }
    .save-btn:disabled { opacity:.6; }
    .loading { text-align:center; color:var(--muted); padding:60px 16px; font-weight:600; }
  </style>
</head>
<body>
  <div class="demoflag" id="demoFlag" style="display:none">وضع العرض — بيانات تجريبية، مش طلبات حقيقية</div>

  <div class="pin-wrap" id="pinScreen">
    <h2 id="pinTitle">لوحة الإدارة</h2>
    <input id="pinInput" inputmode="numeric" maxlength="6" placeholder="••••" autofocus />
    <button onclick="tryPin()">دخول</button>
    <div class="pin-err" id="pinErr">الرقم غلط، جرب تاني</div>
  </div>

  <div id="dash">
    <div class="hero">
      <div class="cafe" id="cafeName">…</div>
      <div class="sub" id="heroSub">لوحة الإدارة — الطلبات والإجمالي</div>
    </div>

    <div class="toptabs">
      <button id="tabOrdersBtn" class="active" onclick="switchTab('orders')">الطلبات</button>
      <button id="tabHistoryBtn" style="display:none" onclick="switchTab('history')">السجل</button>
      <button id="tabExpensesBtn" style="display:none" onclick="switchTab('expenses')">المصروفات</button>
      <button id="tabMenuBtn" style="display:none" onclick="switchTab('menu')">المنيو</button>
    </div>

    <div id="ordersSection">
      <div class="stats">
        <div class="stat"><b id="statCount">0</b><small>عدد الطلبات</small></div>
        <div class="stat"><b id="statBestSeller">—</b><small>الأكثر مبيعاً</small></div>
      </div>
      <div class="listwrap" id="ordersList"></div>
      <div class="refresh-note" id="refreshNote"></div>
    </div>

    <div id="historySection" style="display:none">
      <div class="daynav">
        <button onclick="shiftHistoryDay(-1)">◀ يوم</button>
        <span class="daylabel" id="histDayLabel"></span>
        <button onclick="shiftHistoryDay(1)" id="histNextDayBtn">يوم ▶</button>
      </div>
      <div class="histpicker">
        <input type="date" id="histFrom" />
        <input type="date" id="histTo" />
        <button onclick="loadHistory()">عرض</button>
        <button class="print-btn" id="printReportBtn" style="display:none" onclick="printReport()">🖨️ اطبع تقفيل</button>
      </div>
      <div class="listwrap" id="historyList"></div>
    </div>

    <div id="expensesSection" style="display:none">
      <div class="daynav">
        <button onclick="changeExpensesDate(-1)">◀ السابق</button>
        <span class="daylabel" id="expDateLabel"></span>
        <button onclick="changeExpensesDate(1)" id="expNextDayBtn">التالي ▶</button>
      </div>
      <div class="exp-form" id="expAddRow">
        <div class="field"><label>المبلغ</label><input id="expAmount" type="number" inputmode="decimal" placeholder="مثلاً: 50" /></div>
        <div class="field"><label>ملحوظة (اختياري)</label><input id="expNote" placeholder="مثلاً: لبن" /></div>
        <button class="save-btn" id="expAddBtn" onclick="addExpense()">إضافة</button>
      </div>
      <div class="stats">
        <div class="stat"><b id="expTotal">0</b><small id="expTotalLabel">مصروفات النهاردة</small></div>
      </div>
      <div class="listwrap" id="expensesList"></div>
    </div>

    <div id="menuSection" style="display:none">
      <nav class="nav" id="nav"></nav>
      <main id="menuList"><div class="loading">جاري تحميل المنيو…</div></main>
    </div>
  </div>

  <button class="fab" id="fab" style="display:none" onclick="openAdd()">+ طبق جديد</button>
  <button class="fab" id="newOrderFab" style="display:none" onclick="openNewOrder()">+ طلب جديد</button>

  <div class="scrim" id="scrim" onclick="closeSheets()"></div>

  <div class="sheet" id="editSheet">
    <button class="x-btn" onclick="closeSheets()" aria-label="إغلاق">✕</button>
    <div class="title">تعديل الطبق</div>
    <div class="field"><label>الاسم</label><input id="editName" /></div>
    <div id="editPrices"></div>
    <button class="save-btn" id="editSave" onclick="saveEdit()">حفظ</button>
  </div>

  <div class="sheet" id="addSheet">
    <button class="x-btn" onclick="closeSheets()" aria-label="إغلاق">✕</button>
    <div class="title">طبق جديد</div>
    <div class="field"><label>الاسم</label><input id="addName" placeholder="مثلاً: فرابيه بستاشيو" /></div>
    <div class="field">
      <label>الفئة</label>
      <select id="addCatSelect"></select>
    </div>
    <div class="field"><label>أو اكتب فئة جديدة</label><input id="addCatNew" placeholder="سيبها فاضية لو هتختار من فوق" /></div>
    <div class="check-row">
      <input type="checkbox" id="addHasVariants" onchange="toggleAddVariants()" />
      <label for="addHasVariants">عنده أكتر من مقاس (زي صغير/كبير)؟</label>
    </div>
    <div id="addFlatPrice" class="field"><label>السعر</label><input id="addPrice" type="number" inputmode="decimal" /></div>
    <div id="addVariants" style="display:none">
      <div class="variant-row">
        <div class="field"><label>مقاس 1</label><input id="addV1Name" value="صغير" /></div>
        <div class="field"><label>السعر</label><input id="addV1Price" type="number" inputmode="decimal" /></div>
      </div>
      <div class="variant-row">
        <div class="field"><label>مقاس 2</label><input id="addV2Name" value="كبير" /></div>
        <div class="field"><label>السعر</label><input id="addV2Price" type="number" inputmode="decimal" /></div>
      </div>
    </div>
    <button class="save-btn" id="addSave" onclick="saveAdd()">إضافة</button>
  </div>

  <div class="sheet" id="orderEditSheet">
    <button class="x-btn" onclick="closeSheets()" aria-label="إغلاق">✕</button>
    <div class="title">تعديل الطلب</div>
    <div class="field"><label>رقم الترابيزة</label><input id="oeTable" /></div>
    <div id="oeItems"></div>
    <button type="button" class="add-item-btn" onclick="addOeItemLine()">+ أضف صنف</button>
    <div class="oe-total">الإجمالي: <span id="oeTotal">0</span> <span id="oeTotalCur"></span></div>
    <button class="save-btn" id="oeSave" onclick="saveOrderEdit()">حفظ</button>
  </div>

  <div class="sheet sheet-frame" id="newOrderSheet">
    <button class="x-btn" onclick="closeSheets()" aria-label="إغلاق">✕</button>
    <iframe id="newOrderFrame" src="about:blank"></iframe>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const CLIENT = params.get("c") || "elbob";
    const initialTab = params.get("tab") === "menu" ? "menu" : "orders";
    let CFG = {}, CUR = "ج", LIVE = false, hasMenu = false, hasExpenses = false, POLL = null;
    let mockOrders = [];
    let ordersStarted = false, menuLoaded = false, historyLoaded = false, expensesLoaded = false;
    let state = { items: [], catOrder: [] };
    let editingId = null;
    let oeOrderId = null;
    let liveOrders = []; // local cache of the last-fetched Orders list, for optimistic cancel (see cancelLive)
    let knownOrderIds = null; // order ids seen as of the last refreshLive() poll; null until the first poll lands, so the sound never fires for orders already there on page load

    // ---------- Day-nav helpers (Expenses + History: ◀ السابق / التالي ▶) ----------
    // "Today" means Cairo's business day (apps_script_v2.gs: DAY_START_HOUR=6,
    // TZ=Africa/Cairo) -- never the viewing device's own calendar date. Ahmed's phone is
    // usually on Malaysia time (UTC+8, several hours ahead of Cairo), so during Cairo's
    // midnight-6AM rollover window the device's date has already advanced to tomorrow while
    // Cairo's business day hasn't -- a device-clock "today" is wrong for hours every single
    // day. Fix: ask the backend what day it is (action=today is public, no key, already
    // returns bizDateHuman server-side) once on boot and anchor every "today" on that.
    let serverTodayAnchor = null;
    function deviceTodayStr() {
      const now = new Date();
      const pad = n => String(n).padStart(2, "0");
      return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
    }
    function todayStr() {
      return serverTodayAnchor || deviceTodayStr();
    }
    // Demo mode has no backend to ask (and no real business day to get wrong), so it just
    // keeps the device-clock fallback. A failed fetch leaves serverTodayAnchor unset for the
    // same reason -- fail soft, not blank. Fire-and-forget: never blocks reveal() on this.
    function fetchServerTodayAnchor() {
      if (!LIVE) return;
      fetch(`${CFG.admin_webhook}?action=today`).then(r => r.json()).then(data => {
        if (data && data.date) serverTodayAnchor = data.date;
      }).catch(() => {});
    }
    function shiftDate(dateStr, days) {
      const [y, m, d] = dateStr.split("-").map(Number);
      const dt = new Date(y, m - 1, d + days);
      const pad = n => String(n).padStart(2, "0");
      return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
    }

    // ---------- Expenses local-first state ----------
    // `expenses` is the DISPLAY array renderExpenses() reads -- whatever's currently being
    // looked at (today, merged with pending/failed writes; or a past day, pure server data).
    // `pendingExpenses` is the DURABLE, day-nav-independent array of not-yet-confirmed (today-
    // only) writes, mirrored to localStorage on every change. addExpense pushes the SAME
    // object into both (shared reference), so a background sync's completion -- which always
    // looks the entry up via pendingExpenses, never `expenses` -- still resolves correctly
    // even if the owner flipped to a different day (reassigning `expenses` to something else
    // entirely) while that sync was still in flight. Without this split, a sync landing after
    // such a day-flip would silently find nothing to update, leaving a phantom "بيتزامن…" entry
    // stuck in localStorage forever (confirmed via a dedicated test, not hypothetical).
    let expenses = [];
    let pendingExpenses = [];
    let expensesViewDate = null; // yyyy-MM-dd currently shown; null until loadExpenses() first runs, then always today or an explicit day-nav pick
    function expensesStorageKey() { return "waqti_pending_expenses_" + CLIENT; }
    function loadPendingExpensesFromStorage() {
      try {
        const raw = localStorage.getItem(expensesStorageKey());
        return raw ? JSON.parse(raw) : [];
      } catch (e) { return []; } // private browsing / storage disabled -- just means nothing to restore
    }
    function savePendingExpensesToStorage() {
      try { localStorage.setItem(expensesStorageKey(), JSON.stringify(pendingExpenses)); }
      catch (e) { /* storage blocked -- in-memory state still works for this session */ }
    }

    function reveal() { document.body.classList.add("ready"); }
    setTimeout(reveal, 2500); // safety net -- never leave the page permanently blank

    fetch(`clients/${CLIENT}.json`).then(r => r.json()).then(boot).catch(() => {
      document.getElementById("pinTitle").textContent = "تعذر تحميل الإعدادات";
      reveal();
    });

    function boot(cfg) {
      CFG = cfg; CUR = cfg.currency || "ج";
      if (cfg.theme) {
        const t = cfg.theme, root = document.documentElement.style;
        if (t.blue) root.setProperty('--blue', t.blue);
        if (t.blue2) root.setProperty('--blue-2', t.blue2);
        if (t.gold) root.setProperty('--gold', t.gold);
        if (t.gold2) root.setProperty('--gold-2', t.gold2);
        if (t.bg) root.setProperty('--bg', t.bg);
      }
      const cleanName = (cfg.name_ar || "وقتي").replace(/<[^>]+>/g, '');
      document.getElementById("cafeName").innerHTML = cfg.name_ar || "وقتي";
      document.getElementById("pinTitle").textContent = cleanName + " — لوحة الإدارة";
      document.title = "لوحة الإدارة — " + cleanName;
      LIVE = !!cfg.admin_webhook;
      fetchServerTodayAnchor();
      hasMenu = !!cfg.price_sheet_api;
      // Gated on a per-client features flag, not just LIVE -- admin.html/apps_script_v2.gs
      // are shared across every client, and most other clients' Sheets don't have the
      // Expenses/ReportQueue tabs yet. Same reasoning covers the تقفيل print button on the
      // History tab below (report_request would hit a missing sheet on their backend).
      hasExpenses = LIVE && !!(cfg.features && cfg.features.expenses);
      document.getElementById("tabMenuBtn").style.display = hasMenu ? "block" : "none";
      document.getElementById("tabExpensesBtn").style.display = hasExpenses ? "block" : "none";
      document.getElementById("printReportBtn").style.display = hasExpenses ? "block" : "none";
      // History reads real Orders history via the backend -- nothing to show in demo mode.
      document.getElementById("tabHistoryBtn").style.display = LIVE ? "block" : "none";
      document.getElementById("pinInput").addEventListener("keydown", e => { if (e.key === "Enter") tryPin(); });
      reveal();
    }

    function tryPin() {
      const val = document.getElementById("pinInput").value.trim();
      if (!CFG.admin_pin || val !== String(CFG.admin_pin)) {
        document.getElementById("pinErr").style.display = "block";
        return;
      }
      document.getElementById("pinScreen").style.display = "none";
      document.getElementById("dash").style.display = "block";
      switchTab(initialTab === "menu" && hasMenu ? "menu" : "orders");
    }

    // ---------- Section tabs ----------
    function switchTab(tab) {
      document.getElementById("tabOrdersBtn").classList.toggle("active", tab === "orders");
      document.getElementById("tabHistoryBtn").classList.toggle("active", tab === "history");
      document.getElementById("tabExpensesBtn").classList.toggle("active", tab === "expenses");
      document.getElementById("tabMenuBtn").classList.toggle("active", tab === "menu");
      document.getElementById("ordersSection").style.display = tab === "orders" ? "block" : "none";
      document.getElementById("historySection").style.display = tab === "history" ? "block" : "none";
      document.getElementById("expensesSection").style.display = tab === "expenses" ? "block" : "none";
      document.getElementById("menuSection").style.display = tab === "menu" ? "block" : "none";
      document.getElementById("fab").style.display = (tab === "menu" && hasMenu) ? "flex" : "none";
      document.getElementById("newOrderFab").style.display = (tab === "orders" && LIVE) ? "flex" : "none";
      document.getElementById("heroSub").textContent = tab === "menu"
        ? "إدارة المنيو — الأسعار والتوفر" : tab === "history"
        ? "سجل المبيعات — حسب اليوم" : tab === "expenses"
        ? "المصروفات — تقفيل اليوم" : "لوحة الإدارة — الطلبات والإجمالي";
      document.getElementById("demoFlag").style.display = (tab === "orders" && !LIVE) ? "block" : "none";

      if (tab === "orders" && !ordersStarted) {
        ordersStarted = true;
        if (!LIVE) {
          document.getElementById("refreshNote").textContent = "بيانات تجريبية — هتتبدل بطلبات حقيقية أول ما النظام يشتغل فعلياً";
          seedMockOrders();
          renderMock();
        } else {
          document.getElementById("refreshNote").textContent = "بيتحدث كل 15 ثانية";
          refreshLive();
          POLL = setInterval(refreshLive, 15000);
        }
      }
      if (tab === "history" && LIVE && !historyLoaded) {
        historyLoaded = true;
        const today = new Date(), weekAgo = new Date(today.getTime() - 6 * 86400000);
        document.getElementById("histFrom").value = toDateStr(weekAgo);
        document.getElementById("histTo").value = toDateStr(today);
        loadHistory();
      }
      if (tab === "expenses" && hasExpenses && !expensesLoaded) {
        expensesLoaded = true;
        loadExpenses();
      }
      if (tab === "menu" && hasMenu && !menuLoaded) {
        menuLoaded = true;
        loadMenu();
      }
    }

    // ---------- Orders tab: live mode (real Apps Script) ----------
    // Short beep via the Web Audio API -- no audio file to host, and it works even if the
    // tab has no speakers focus/autoplay issues, since by the time refreshLive() ever runs
    // the owner has already interacted with the page once (PIN entry), which satisfies
    // browser autoplay policy for starting an AudioContext.
    function playNewOrderSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = "sine"; osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        osc.start(); osc.stop(ctx.currentTime + 0.4);
      } catch (e) { /* audio blocked -- order still shows up visually either way */ }
    }
    function refreshLive() {
      const url = `${CFG.admin_webhook}?action=list&key=${encodeURIComponent(CFG.admin_key || "")}`;
      fetch(url).then(r => r.json()).then(data => {
        if (data.error) { document.getElementById("refreshNote").textContent = "خطأ: " + data.error; return; }
        liveOrders = data.orders;
        // knownOrderIds starts null (set only here) so the very first poll after opening the
        // dashboard never plays a sound for every order already sitting there.
        if (knownOrderIds && liveOrders.some(o => !knownOrderIds.has(o.id))) playNewOrderSound();
        knownOrderIds = new Set(liveOrders.map(o => o.id));
        renderOrders(liveOrders, cancelLive, openOrderEdit, doneLive);
      }).catch(() => { document.getElementById("refreshNote").textContent = "تعذر الاتصال — هيحاول تاني"; });
    }
    // Cancels instantly in the UI (no waiting on the Apps Script round-trip, which can take
    // several seconds) -- flips the local cache + re-renders right away, syncs to the Sheet in
    // the background, and rolls the status back with an alert only if that sync actually fails.
    // The next 15s poll (refreshLive) reconciles regardless, so this never drifts for long.
    function cancelLive(id) {
      const o = liveOrders.find(x => x.id === id);
      if (!o) return;
      const prevStatus = o.status;
      o.status = "cancelled";
      renderOrders(liveOrders, cancelLive, openOrderEdit, doneLive);
      const url = `${CFG.admin_webhook}?action=cancel&id=${encodeURIComponent(id)}&key=${encodeURIComponent(CFG.admin_key || "")}`;
      fetch(url).then(r => r.json()).then(data => {
        if (data.error) { o.status = prevStatus; renderOrders(liveOrders, cancelLive, openOrderEdit, doneLive); alert("تعذر إلغاء الطلب: " + data.error); }
      }).catch(() => { o.status = prevStatus; renderOrders(liveOrders, cancelLive, openOrderEdit, doneLive); alert("تعذر إلغاء الطلب — حاول تاني"); });
    }
    // Marks an order served/fulfilled instantly, same local-first pattern as cancel -- but no
    // confirm() dialog, since this is a routine action tapped many times a shift, not an
    // irreversible "this sale didn't happen" decision. Once done, renderOrders drops it from
    // the working list entirely (see renderOrders below) instead of greying it out like cancel.
    function doneLive(id) {
      const o = liveOrders.find(x => x.id === id);
      if (!o) return;
      const prevStatus = o.status;
      o.status = "done";
      renderOrders(liveOrders, cancelLive, openOrderEdit, doneLive);
      const url = `${CFG.admin_webhook}?action=done&id=${encodeURIComponent(id)}&key=${encodeURIComponent(CFG.admin_key || "")}`;
      fetch(url).then(r => r.json()).then(data => {
        if (data.error) { o.status = prevStatus; renderOrders(liveOrders, cancelLive, openOrderEdit, doneLive); alert("تعذر تحديد الطلب كمنتهي: " + data.error); }
      }).catch(() => { o.status = prevStatus; renderOrders(liveOrders, cancelLive, openOrderEdit, doneLive); alert("تعذر الاتصال — حاول تاني"); });
    }

    // ---------- History tab: per-day totals over an owner-chosen date range ----------
    function toDateStr(d) {
      const pad = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }
    // ◀ يوم / يوم ▶: quick-jumps the range to a single day either side of whatever single
    // day is currently shown; if a multi-day range is currently shown instead, starts from
    // today. Pure frontend convenience -- history already supports any date range, no backend
    // change needed here (unlike Expenses' day-nav, which needed expense_list to accept a date).
    function shiftHistoryDay(delta) {
      const from = document.getElementById("histFrom").value, to = document.getElementById("histTo").value;
      const base = (from && from === to) ? from : todayStr();
      const next = shiftDate(base, delta);
      document.getElementById("histFrom").value = next;
      document.getElementById("histTo").value = next;
      loadHistory();
    }
    function updateHistDayLabel() {
      const from = document.getElementById("histFrom").value, to = document.getElementById("histTo").value;
      const label = document.getElementById("histDayLabel");
      const isSingleDay = from && to && from === to;
      label.textContent = isSingleDay ? (from === todayStr() ? "اليوم" : from) : "فترة مختارة";
      document.getElementById("histNextDayBtn").disabled = isSingleDay && from === todayStr(); // no point browsing into the future
    }
    // Keyed by from+to so navigating back to an already-seen range (very common with the
    // ◀/▶ day-nav) paints instantly from the last successful response, before the Apps
    // Script round-trip (same several-second latency as Expenses/stock toggle) even fires --
    // then silently swaps in the fresh response once it lands. In-memory only (no
    // localStorage) -- unlike the menu, a stale history range is cheap to re-fetch and not
    // worth persisting across a reload.
    const historyCache = {};
    function historyCacheKey(from, to) { return from + "|" + to; }
    function loadHistory() {
      const from = document.getElementById("histFrom").value;
      const to = document.getElementById("histTo").value;
      updateHistDayLabel();
      const box = document.getElementById("historyList");
      if (!from || !to) { box.innerHTML = '<div class="empty">اختار تاريخ البداية والنهاية</div>'; return; }
      const cached = historyCache[historyCacheKey(from, to)];
      if (cached) renderHistory(cached);
      else box.innerHTML = '<div class="loading">جاري التحميل…</div>';
      const url = `${CFG.admin_webhook}?action=history&from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&key=${encodeURIComponent(CFG.admin_key || "")}`;
      fetch(url).then(r => r.json()).then(data => {
        if (data.error) { if (!cached) box.innerHTML = `<div class="empty">خطأ: ${esc(data.error)}</div>`; return; }
        historyCache[historyCacheKey(from, to)] = data.days || [];
        renderHistory(data.days || []);
      }).catch(() => { if (!cached) box.innerHTML = '<div class="empty">تعذر الاتصال — حاول تاني</div>'; });
    }
    function renderHistory(days) {
      const box = document.getElementById("historyList");
      if (!days.length) { box.innerHTML = '<div class="empty">مفيش طلبات في الفترة دي</div>'; return; }
      box.innerHTML = "";
      [...days].reverse().forEach(d => {
        const el = document.createElement("div");
        el.className = "order hist-day";
        el.innerHTML = `
          <div class="row1"><span class="tbl">${esc(d.date)}</span><span class="time">${esc(d.orders)} طلب</span></div>
          <div class="row2"><span class="total">${esc(d.total)} ${CUR}</span></div>`;
        box.appendChild(el);
      });
    }

    // ---------- تقفيل print trigger: reuses the history tab's own from/to picker instead of
    // duplicating day/week shortcut logic in a second place -- one date range, two actions
    // (view, print). Fire-and-forget by design (no print-confirmation echoed back). ----------
    function printReport() {
      const from = document.getElementById("histFrom").value, to = document.getElementById("histTo").value;
      if (!from || !to) { alert("اختار تاريخ البداية والنهاية"); return; }
      const btn = document.getElementById("printReportBtn");
      btn.disabled = true;
      const url = `${CFG.admin_webhook}?action=report_request&from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&key=${encodeURIComponent(CFG.admin_key || "")}`;
      fetch(url).then(r => r.json()).then(data => {
        if (data.error) { alert("خطأ: " + data.error); return; }
        alert("طلب الطباعة وصل — هيطبع على الطابعة في الكافيه خلال لحظات");
      }).catch(() => alert("تعذر الاتصال — حاول تاني"))
        // Brief self-disable so impatient re-tapping during a real print_bridge.py outage
        // doesn't inflate the queue further than necessary.
        .finally(() => { setTimeout(() => { btn.disabled = false; }, 5000); });
    }

    // ---------- Orders tab: demo mode (mock data, no backend) ----------
    function seedMockOrders() {
      const now = Date.now();
      const sample = [
        { table: "2", items: "1× فرابيه فانيليا، 1× ميلك شيك أوريو", total: 115 },
        { table: "5", items: "2× موهيتو فراولة", total: 110 },
        { table: "1", items: "1× وافل لوتس، 1× عصير مانجو", total: 115 },
        { table: "3", items: "1× آيس كريم فروله (كبير)", total: 20 },
        { table: "4", items: "1× سموزي بلوبيري، 1× كريب أوريو", total: 120 },
        { table: "2", items: "1× ميلك شيك سكويز سبيشل", total: 90 },
        { table: "6", items: "3× شاي، 1× سحلب بالمكسرات", total: 80 },
      ];
      mockOrders = sample.map((o, i) => ({
        id: "demo" + i, table: o.table, items: o.items, total: o.total, status: "new",
        time: new Date(now - (sample.length - i) * 11 * 60000).toTimeString().slice(0, 5)
      }));
    }
    function renderMock() {
      renderOrders(mockOrders, (id) => {
        const o = mockOrders.find(x => x.id === id);
        if (o) o.status = "cancelled";
        renderMock();
      }, null, (id) => {
        const o = mockOrders.find(x => x.id === id);
        if (o) o.status = "done";
        renderMock();
      });
    }

    // ---------- Orders tab: shared render ----------
    // o.table and o.items both trace back to customer input (table via the page's own
    // ?table= URL param, items via the order note's free text) -- escape before innerHTML,
    // the same way index.html already does for its own cart-note preview. Without this, a
    // note like "<img src=x onerror=...>" gets stored verbatim in the Orders sheet and
    // executes here, inside the PIN-gated dashboard, the next time it's opened.
    const esc = s => String(s).replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));

    // Orders written since the 2026-10-10 receipts overhaul store `items` as a JSON array
    // (name/qty/price per line) instead of a flattened display string -- lets the owner see
    // a price per line here too, same as the printed cashier copy. Orders from before that
    // (still sitting in the real Sheet from the pilot period) are a plain string -- returns
    // null so callers (itemsLabel, bestSellerLabel) each decide their own fallback.
    function parseOrderItems(raw) {
      try {
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : null;
      } catch (e) { return null; }
    }
    function itemsLabel(raw) {
      const items = parseOrderItems(raw);
      if (items) return items.map(i => `${esc(i.qty)}× ${esc(i.name)} — ${esc(i.price * i.qty)} ${CUR}`).join("<br>");
      return esc(raw); // legacy plain-string order, pre-dating the JSON format
    }

    // Best-selling item across every REAL sale fetched this session (new + done -- cancelled
    // never happened, excluded). Legacy plain-string orders can't be itemized, same limitation
    // itemsLabel already has -- just skipped here, they still count toward عدد الطلبات.
    function bestSellerLabel(orders) {
      const qtyByName = {};
      orders.forEach(o => {
        if (o.status === "cancelled") return;
        const items = parseOrderItems(o.items);
        if (!items) return;
        items.forEach(i => { qtyByName[i.name] = (qtyByName[i.name] || 0) + (Number(i.qty) || 0); });
      });
      let bestName = null, bestQty = 0;
      Object.keys(qtyByName).forEach(name => { if (qtyByName[name] > bestQty) { bestQty = qtyByName[name]; bestName = name; } });
      return bestName ? `${bestName} (${bestQty})` : "—";
    }

    function renderOrders(orders, onCancel, onEdit, onDone) {
      // 'done' orders disappear from the working list entirely (not just greyed out like
      // cancelled) -- the point is staff only see what's still pending.
      const visibleOrders = orders.filter(o => o.status !== "done");
      const activeCount = visibleOrders.filter(o => o.status !== "cancelled").length;
      document.getElementById("statCount").textContent = activeCount;
      document.getElementById("statBestSeller").textContent = bestSellerLabel(orders); // from every real sale, not just what's still visible
      const box = document.getElementById("ordersList");
      if (!visibleOrders.length) {
        box.innerHTML = orders.length
          ? '<div class="empty">كل الطلبات خلصت ✓</div>'
          : '<div class="empty">لسه مفيش طلبات النهاردة</div>';
        return;
      }
      box.innerHTML = "";
      [...visibleOrders].reverse().forEach(o => {
        const cancelled = o.status === "cancelled";
        const el = document.createElement("div");
        el.className = "order" + (cancelled ? " cancelled" : "");
        el.innerHTML = `
          <div class="row1"><span class="tbl">ترابيزة ${esc(o.table)}</span><span class="time">${o.time}</span></div>
          <div class="items">${itemsLabel(o.items)}</div>
          <div class="row2">
            <span class="total">${o.total} ${CUR}</span>
            ${cancelled ? '<span class="status-chip cancelled">ملغي</span>' : `
              <div class="order-actions">
                ${onEdit ? '<button class="edit-btn">✏️ تعديل</button>' : ''}
                ${onDone ? '<button class="done-btn" data-id="' + o.id + '">تم ✓</button>' : ''}
                <button class="cancel-btn" data-id="${o.id}">إلغاء الطلب</button>
              </div>`}
          </div>`;
        if (!cancelled) {
          el.querySelector(".cancel-btn").onclick = () => {
            if (confirm("تأكيد إلغاء طلب ترابيزة " + o.table + "؟")) onCancel(o.id);
          };
          if (onEdit) el.querySelector(".edit-btn").onclick = () => onEdit(o);
          if (onDone) el.querySelector(".done-btn").onclick = () => onDone(o.id);
        }
        box.appendChild(el);
      });
    }

    // ---------- Expenses tab (تقفيل): log a cash expense, void a mistaken entry ----------
    // Local-first: addExpense/voidExpense mutate the `expenses` array and re-render
    // IMMEDIATELY, never waiting on the Apps Script round-trip (observed 3-7s per call live,
    // occasionally much worse) -- the network call happens in the background afterward. See
    // the `expenses` state + storage helpers declared near the top of this script.
    // Day-nav (◀ السابق / التالي ▶): expense_add always logs to TODAY regardless of which
    // day is being viewed (a past-dated add is a different, more complex thing -- not
    // needed here), so the add form only makes sense -- and only shows -- on today's view.
    // The local-first pending/localStorage machinery below is ALSO today-only for the same
    // reason: nothing optimistic can exist for a day you can't add to.
    function changeExpensesDate(days) {
      expensesViewDate = shiftDate(expensesViewDate || todayStr(), days);
      loadExpenses();
    }
    function jumpExpensesToday() {
      expensesViewDate = todayStr();
      loadExpenses();
    }
    function renderExpensesDateBar() {
      const isToday = expensesViewDate === todayStr();
      const label = document.getElementById("expDateLabel");
      label.textContent = isToday ? "اليوم" : expensesViewDate;
      label.className = "daylabel" + (isToday ? "" : " jumpable");
      label.onclick = isToday ? null : jumpExpensesToday;
      document.getElementById("expNextDayBtn").disabled = isToday; // no point browsing into the future
      document.getElementById("expAddRow").style.display = isToday ? "" : "none";
      document.getElementById("expTotalLabel").textContent = isToday ? "مصروفات النهاردة" : "مصروفات اليوم ده";
    }

    function loadExpenses() {
      if (!expensesViewDate) expensesViewDate = todayStr();
      const isToday = expensesViewDate === todayStr();
      renderExpensesDateBar();

      if (isToday) {
        pendingExpenses = loadPendingExpensesFromStorage();
        expenses = pendingExpenses.slice(); // same object references as pendingExpenses -- a later sync resolving via pendingExpenses stays visible here too
        if (expenses.length) renderExpenses(); // show anything unsynced from a previous visit right away, before the network even responds
      } else {
        expenses = []; // no local-first overlay for a non-today day -- just show what loads
      }

      const url = `${CFG.admin_webhook}?action=expense_list&date=${encodeURIComponent(expensesViewDate)}&key=${encodeURIComponent(CFG.admin_key || "")}`;
      fetch(url).then(r => r.json()).then(data => {
        if (data.error) { if (!expenses.length) document.getElementById("expensesList").innerHTML = `<div class="empty">خطأ: ${esc(data.error)}</div>`; return; }
        const server = (data.expenses || []).map(x => ({ ...x }));
        if (isToday) {
          const serverIds = new Set(server.map(x => x.id));
          // pendingExpenses is the durable source -- drop anything the server now has (e.g. a
          // retry that landed while this fetch was already in flight).
          pendingExpenses = pendingExpenses.filter(x => !serverIds.has(x.id));
          expenses = server.concat(pendingExpenses);
          savePendingExpensesToStorage();
        } else {
          expenses = server;
        }
        renderExpenses();
      }).catch(() => { if (!expenses.length) document.getElementById("expensesList").innerHTML = '<div class="empty">تعذر الاتصال — حاول تاني</div>'; });
    }

    function renderExpenses() {
      const total = expenses.filter(x => x.status !== "voided").reduce((s, x) => s + x.amount, 0);
      document.getElementById("expTotal").textContent = total + " " + CUR;
      const box = document.getElementById("expensesList");
      if (!expenses.length) {
        box.innerHTML = `<div class="empty">${expensesViewDate === todayStr() ? "لسه مفيش مصروفات النهاردة" : "مفيش مصروفات في اليوم ده"}</div>`;
        return;
      }
      box.innerHTML = "";
      [...expenses].reverse().forEach(x => {
        const voided = x.status === "voided";
        const el = document.createElement("div");
        el.className = "order" + (voided ? " cancelled" : "");
        el.innerHTML = `
          <div class="row1"><span class="tbl">${esc(x.note || "بدون ملحوظة")}</span><span class="time">${esc(String(x.ts || "").slice(11, 16))}</span></div>
          <div class="row2">
            <span class="total">${esc(x.amount)} ${CUR}</span>
            ${voided ? '<span class="status-chip cancelled">ملغي</span>' : `<button class="cancel-btn" data-id="${x.id}">إلغاء المصروف</button>`}
          </div>
          ${x._pending ? '<div class="row3"><span class="status-chip pending">بيتزامن مع الشيت…</span></div>' : ""}
          ${x._failed ? `<div class="row3"><button class="retry-btn" data-id="${x.id}">⚠️ لم يتزامن — إعادة المحاولة</button></div>` : ""}`;
        if (!voided) el.querySelector(".cancel-btn").onclick = () => {
          if (confirm("تأكيد إلغاء مصروف " + x.amount + " " + CUR + "؟")) voidExpense(x.id);
        };
        if (x._failed) el.querySelector(".retry-btn").onclick = () => retryExpense(x.id);
        box.appendChild(el);
      });
    }

    // Sends the add for one local (not-yet-synced) entry in the background. Shared by
    // addExpense (first attempt) and retryExpense (after a failure) so both reconcile the
    // same way: success swaps the temp id for the real expense_id; failure marks it _failed
    // so renderExpenses shows a retry button instead of silently dropping it. Always resolves
    // via pendingExpenses (not `expenses`, which day-nav can reassign out from under a
    // still-in-flight sync) -- see the pendingExpenses comment above for why that split exists.
    function syncExpenseAdd(localId) {
      const e = pendingExpenses.find(x => x.id === localId);
      if (!e) return;
      const url = `${CFG.admin_webhook}?action=expense_add&amount=${encodeURIComponent(e.amount)}&note=${encodeURIComponent(e.note)}&key=${encodeURIComponent(CFG.admin_key || "")}`;
      const stillToday = () => expensesViewDate === todayStr();
      fetch(url).then(r => r.json()).then(data => {
        const cur = pendingExpenses.find(x => x.id === localId);
        if (!cur) return;
        if (data.error) {
          // If it was voided while still mid-sync, there's nothing on the server to void --
          // just drop it instead of surfacing a confusing "retry" for an entry the owner
          // already said she doesn't want.
          if (cur._voidPending) { pendingExpenses = pendingExpenses.filter(x => x.id !== localId); }
          else { cur._pending = false; cur._failed = true; }
          savePendingExpensesToStorage();
          if (stillToday()) renderExpenses();
          return;
        }
        cur.id = data.expense_id; delete cur._pending;
        const needsVoid = cur._voidPending; delete cur._voidPending;
        pendingExpenses = pendingExpenses.filter(x => x.id !== cur.id); // fully synced -- no longer pending bookkeeping, the next list load carries it from the server
        savePendingExpensesToStorage();
        if (stillToday()) renderExpenses();
        if (needsVoid) voidExpense(cur.id); // now that it has a real id, send the void the owner already requested
      }).catch(() => {
        const cur = pendingExpenses.find(x => x.id === localId);
        if (!cur) return;
        if (cur._voidPending) { pendingExpenses = pendingExpenses.filter(x => x.id !== localId); }
        else { cur._pending = false; cur._failed = true; }
        savePendingExpensesToStorage();
        if (stillToday()) renderExpenses();
      });
    }

    function addExpense() {
      const amountRaw = document.getElementById("expAmount").value;
      const amount = Number(amountRaw);
      if (amountRaw === "" || isNaN(amount) || amount <= 0) { alert("المبلغ لازم يكون رقم أكبر من صفر"); return; }
      const note = document.getElementById("expNote").value.trim();
      document.getElementById("expAmount").value = "";
      document.getElementById("expNote").value = "";

      const localId = "local_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
      const now = new Date();
      const pad = n => String(n).padStart(2, "0");
      const ts = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      const entry = { id: localId, ts, amount, note, status: "active", _pending: true };
      pendingExpenses.push(entry);
      expenses.push(entry); // only reachable while viewing today -- the add row is hidden otherwise
      renderExpenses();
      savePendingExpensesToStorage();
      syncExpenseAdd(localId);
    }

    function retryExpense(id) {
      const e = pendingExpenses.find(x => x.id === id);
      if (!e || !e._failed) return;
      e._failed = false; e._pending = true;
      renderExpenses();
      savePendingExpensesToStorage();
      syncExpenseAdd(id);
    }

    // Marks voided instantly in the UI; syncs to the Sheet in the background, rolling back
    // with an alert only if that sync actually fails. If the entry is still mid-add (never
    // got a real id yet), the actual void call is deferred until syncExpenseAdd resolves.
    // Checks pendingExpenses FIRST (canonical for any not-yet-confirmed entry); a confirmed
    // entry only ever lives in `expenses`. The network call always fires even if no local
    // copy is found (e.g. the owner navigated to a different day right as syncExpenseAdd's
    // deferred void was about to fire) -- a void the owner asked for must never get silently
    // dropped just because its item isn't currently on screen.
    function voidExpense(id) {
      const e = pendingExpenses.find(x => x.id === id) || expenses.find(x => x.id === id);
      const prevStatus = e ? e.status : null;
      if (e) {
        e.status = "voided";
        renderExpenses();
        savePendingExpensesToStorage();
        if (e._pending) { e._voidPending = true; return; }
      }
      const url = `${CFG.admin_webhook}?action=expense_void&id=${encodeURIComponent(id)}&key=${encodeURIComponent(CFG.admin_key || "")}`;
      fetch(url).then(r => r.json()).then(data => {
        if (data.error) {
          if (e) { e.status = prevStatus; renderExpenses(); }
          alert("تعذر إلغاء المصروف: " + data.error);
        }
      }).catch(() => {
        if (e) { e.status = prevStatus; renderExpenses(); }
        alert("تعذر إلغاء المصروف — حاول تاني");
      });
    }

    // ---------- Menu tab: load + group the Menu sheet (this IS the full catalog -- every
    // item was seeded into it already, so unlike index.html's merge there's no JSON fallback
    // needed here for display purposes) ----------
    // Local-first, same latency-hiding pattern as Expenses/stock toggle: paints the last
    // successful menu INSTANTLY from cache (memory, falling back to localStorage so it
    // survives a reload) before the Apps Script round-trip even fires, then silently swaps
    // in the fresh response once it lands.
    let menuRowsCache = null;
    function menuCacheStorageKey() { return "waqti_menu_cache_" + CLIENT; }
    function loadMenuRowsFromStorage() {
      try {
        const raw = localStorage.getItem(menuCacheStorageKey());
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; } // private browsing / storage disabled -- just means nothing to restore
    }
    function saveMenuRowsToStorage(rows) {
      try { localStorage.setItem(menuCacheStorageKey(), JSON.stringify(rows)); }
      catch (e) { /* storage blocked -- in-memory cache still works for this session */ }
    }
    function loadMenu() {
      if (!menuRowsCache) menuRowsCache = loadMenuRowsFromStorage();
      if (menuRowsCache) { state = groupRows(menuRowsCache); renderMenu(); }
      fetch(`${CFG.price_sheet_api}?action=menu`).then(r => r.json()).then(data => {
        const rows = (data && data.rows) || [];
        menuRowsCache = rows;
        saveMenuRowsToStorage(rows);
        state = groupRows(rows);
        renderMenu();
      }).catch(() => {
        if (!menuRowsCache) document.getElementById("menuList").innerHTML = '<div class="loading">تعذر تحميل المنيو — اقفل الصفحة وافتحها تاني</div>';
      });
    }

    function groupRows(rows) {
      const byId = {};
      rows.forEach(r => {
        const id = String(r.item_id || "").trim();
        if (!id) return;
        (byId[id] = byId[id] || []).push(r);
      });
      const catOrder = [];
      const items = Object.keys(byId).map(id => {
        const itemRows = byId[id];
        const category = (itemRows[0].category || "").trim() || "إضافات";
        if (!catOrder.includes(category)) catOrder.push(category);
        const active = itemRows.every(r => String(r.active).trim().toUpperCase() !== "FALSE");
        const variantRows = itemRows.filter(r => String(r.variant || "").trim() !== "");
        const flatRow = itemRows.find(r => String(r.variant || "").trim() === "") || itemRows[0];
        const offerFields = (r) => ({
          salePrice: (r.sale_price_egp === "" || r.sale_price_egp == null) ? null : Number(r.sale_price_egp),
          onOffer: String(r.on_offer || "").trim().toUpperCase() === "TRUE",
        });
        return {
          id, category, name_ar: itemRows[0].name_ar, active,
          variants: variantRows.length
            ? variantRows.map(r => ({ name: String(r.variant).trim(), price: Number(r.price_egp), ...offerFields(r) }))
            : null,
          price: variantRows.length ? null : Number(flatRow.price_egp),
          ...(variantRows.length ? {} : offerFields(flatRow)),
        };
      });
      return { items, catOrder };
    }

    // "On offer" means EVERY row has both a configured discount price and the toggle on --
    // a multi-variant item toggles both sizes together (same pattern as the stock pill), so
    // a half-on state should never actually happen, but checking "every" rather than "some"
    // means the badge never claims a deal that isn't fully active on all sizes.
    function offerOn(it) {
      return it.variants ? it.variants.every(v => v.onOffer) : !!it.onOffer;
    }
    function offerConfigured(it) {
      return it.variants ? it.variants.every(v => v.salePrice != null) : it.salePrice != null;
    }

    function priceLabel(it) {
      if (it.variants) {
        const label = it.variants.map(v => `${v.name} ${offerOn(v) ? v.salePrice : v.price}`).join(" · ") + " " + CUR;
        return (offerOn(it) ? "خصم " : "") + label;
      }
      if (offerOn(it)) return `<s>${it.price}</s> ${it.salePrice} ${CUR} خصم`;
      return it.price + " " + CUR;
    }

    function renderMenu() {
      const nav = document.getElementById("nav"); nav.innerHTML = "";
      const list = document.getElementById("menuList"); list.innerHTML = "";
      if (!state.items.length) { list.innerHTML = '<div class="loading">لسه مفيش أصناف</div>'; return; }
      state.catOrder.forEach((cat, ci) => {
        const catItems = state.items.filter(i => i.category === cat);
        if (!catItems.length) return;
        const btn = document.createElement("button");
        btn.textContent = cat; if (ci === 0) btn.className = "active";
        btn.onclick = () => document.getElementById("cat-" + ci).scrollIntoView({ behavior: "smooth", block: "start" });
        nav.appendChild(btn);

        const sec = document.createElement("section");
        sec.className = "cat"; sec.id = "cat-" + ci;
        sec.innerHTML = `<h2>${cat}</h2>`;
        catItems.forEach(it => sec.appendChild(itemCard(it)));
        list.appendChild(sec);
      });
    }

    function itemCard(it) {
      const card = document.createElement("div");
      card.className = "mitem" + (it.active ? "" : " off");
      card.innerHTML = `
        <div class="minfo">
          <div class="mname">${it.name_ar}</div>
          <div class="mprice">${priceLabel(it)}</div>
        </div>
        <div class="mactions">
          <button class="moffer ${offerOn(it) ? "on" : ""}" title="عرض">خصم</button>
          <button class="medit" title="تعديل">✏️</button>
          <button class="mstock ${it.active ? "on" : "off"}">${it.active ? "متوفر" : "خلصت"}</button>
        </div>`;
      card.querySelector(".moffer").onclick = () => toggleOffer(it.id);
      card.querySelector(".medit").onclick = () => openEdit(it.id);
      card.querySelector(".mstock").onclick = () => toggleStock(it.id);
      return card;
    }

    // Tapping the offer pill: if no discount price is configured yet, open the edit sheet
    // so she can set one (saving it there turns the offer on automatically -- see saveEdit).
    // If a price IS already configured, this is a plain on/off toggle, same pattern as stock.
    // Both toggles flip the local state and re-render INSTANTLY (no waiting on the Apps
    // Script round-trip, which can take several seconds) -- syncMenuRow sends the write in
    // the background. No rollback-on-failure here (unlike Expenses/order-cancel): just an
    // alert, since a wrong card state is immediately obvious and a second tap self-corrects.
    function toggleOffer(id) {
      const it = state.items.find(i => i.id === id);
      if (!it) return;
      if (!offerConfigured(it)) { openEdit(id); return; }
      const newOn = !offerOn(it);
      if (it.variants) it.variants.forEach(v => { v.onOffer = newOn; });
      else it.onOffer = newOn;
      renderMenu();
      syncMenuRow(it);
    }

    function rowsForItem(it) {
      return it.variants ? it.variants.map(v => ({ variant: v.name, price: v.price })) : [{ variant: "", price: it.price }];
    }

    // GET, not POST -- a POST with Content-Type:application/json triggers a CORS preflight
    // (OPTIONS) that Apps Script Web Apps don't handle, same reason index.html's sendOrder
    // uses text/plain for Squeeze. GET is a CORS-safe "simple request," no preflight at all.
    function menuSet(fields) {
      const qs = new URLSearchParams(Object.assign({ action: "menu_set", key: CFG.admin_key || "" }, fields));
      return fetch(`${CFG.price_sheet_api}?${qs.toString()}`).then(r => r.json());
    }

    // Chains through it._syncChain so rapid repeated taps on the SAME item serialize instead
    // of racing (two concurrent menuSet writes could otherwise land on the real Sheet out of
    // order and leave it on the stale value). Each queued write reads it.active/onOffer at
    // the time it actually RUNS, not when it was queued, so it always sends the latest state.
    function syncMenuRow(it) {
      it._syncChain = (it._syncChain || Promise.resolve()).then(() => writeMenuRow(it));
      return it._syncChain;
    }

    function writeMenuRow(it) {
      // menuSet upserts the WHOLE row server-side, not a partial patch -- stock + offer
      // fields must always be resent together, or one toggle would silently wipe the other.
      const writes = rowsForItem(it).map(r => {
        const v = it.variants ? it.variants.find(x => x.name === r.variant) : it;
        return menuSet({
          item_id: it.id, category: it.category, name_ar: it.name_ar,
          variant: r.variant, price_egp: r.price, active: String(it.active),
          sale_price_egp: v.salePrice == null ? '' : v.salePrice, on_offer: String(!!v.onOffer),
        });
      });
      return Promise.all(writes).then(results => {
        if (!results.every(r => r && r.ok)) alert("حصل خطأ — حاول تاني");
      }).catch(() => alert("تعذر الاتصال — حاول تاني"));
    }

    function toggleStock(id) {
      const it = state.items.find(i => i.id === id);
      if (!it) return;
      it.active = !it.active;
      renderMenu();
      syncMenuRow(it);
    }

    // ---------- Edit existing item (name + price + optional discount price -- not variant
    // labels/sizes) ----------
    function openEdit(id) {
      editingId = id;
      const it = state.items.find(i => i.id === id);
      document.getElementById("editName").value = it.name_ar;
      const box = document.getElementById("editPrices"); box.innerHTML = "";
      if (it.variants) {
        it.variants.forEach(v => {
          const row = document.createElement("div");
          row.className = "field";
          row.innerHTML = `<label>السعر — ${v.name}</label><input type="number" inputmode="decimal" class="edit-variant-price" data-name="${v.name}" value="${v.price}" />`;
          box.appendChild(row);
          const saleRow = document.createElement("div");
          saleRow.className = "field";
          saleRow.innerHTML = `<label>سعر العرض — ${v.name} (اختياري)</label>
            <input type="number" inputmode="decimal" class="edit-variant-sale" data-name="${v.name}" value="${v.salePrice != null ? v.salePrice : ''}" placeholder="سيبه فاضي لو مفيش عرض" />`;
          box.appendChild(saleRow);
        });
      } else {
        box.innerHTML = `
          <div class="field"><label>السعر</label><input type="number" inputmode="decimal" id="editFlatPrice" value="${it.price}" /></div>
          <div class="field"><label>سعر العرض (اختياري)</label>
            <input type="number" inputmode="decimal" id="editFlatSale" value="${it.salePrice != null ? it.salePrice : ''}" placeholder="سيبه فاضي لو مفيش عرض" /></div>`;
      }
      openSheet("editSheet");
    }

    function saveEdit() {
      const it = state.items.find(i => i.id === editingId);
      if (!it) return;
      const name = document.getElementById("editName").value.trim();
      if (!name) { alert("اكتب اسم الصنف"); return; }

      // salePrice null = no discount configured for that row. Validated the same as the
      // regular price when present, but it's always optional.
      let rows;
      if (it.variants) {
        rows = []; let bad = false;
        document.querySelectorAll(".edit-variant-price").forEach(inp => {
          const price = Number(inp.value);
          if (inp.value === "" || isNaN(price) || price < 0) bad = true;
          const saleInp = document.querySelector(`.edit-variant-sale[data-name="${inp.dataset.name}"]`);
          const saleRaw = (saleInp ? saleInp.value : "").trim();
          const salePrice = saleRaw === "" ? null : Number(saleRaw);
          if (salePrice != null && (isNaN(salePrice) || salePrice < 0)) bad = true;
          rows.push({ variant: inp.dataset.name, price, salePrice });
        });
        if (bad) { alert("تأكد إن كل الأسعار أرقام صح"); return; }
      } else {
        const raw = document.getElementById("editFlatPrice").value;
        const price = Number(raw);
        if (raw === "" || isNaN(price) || price < 0) { alert("السعر لازم يكون رقم"); return; }
        const saleRaw = document.getElementById("editFlatSale").value.trim();
        const salePrice = saleRaw === "" ? null : Number(saleRaw);
        if (salePrice != null && (isNaN(salePrice) || salePrice < 0)) { alert("سعر العرض لازم يكون رقم"); return; }
        rows = [{ variant: "", price, salePrice }];
      }

      // on_offer isn't touched by a normal edit -- UNLESS the discount price just got set
      // for the very first time (she clearly wants it active right away, same as tapping
      // the offer pill immediately after), or just got cleared back to empty (can't stay
      // "on offer" with no price).
      const hadPriceBefore = offerConfigured(it);
      const hasPriceNow = rows.every(r => r.salePrice != null);
      const wasOn = offerOn(it);
      const newOn = !hasPriceNow ? false : (!hadPriceBefore ? true : wasOn);

      const btn = document.getElementById("editSave"); btn.disabled = true; btn.textContent = "جاري الحفظ…";
      Promise.all(rows.map(r => menuSet({
        item_id: it.id, category: it.category, name_ar: name,
        variant: r.variant, price_egp: r.price, active: String(it.active),
        sale_price_egp: r.salePrice == null ? '' : r.salePrice, on_offer: String(newOn),
      }))).then(results => {
        if (!results.every(r => r && r.ok)) throw new Error("save_failed");
        it.name_ar = name;
        if (it.variants) it.variants.forEach(v => {
          const r = rows.find(x => x.variant === v.name);
          if (r) { v.price = r.price; v.salePrice = r.salePrice; v.onOffer = newOn; }
        });
        else { it.price = rows[0].price; it.salePrice = rows[0].salePrice; it.onOffer = newOn; }
        closeSheets(); renderMenu();
      }).catch(() => alert("حصل خطأ في الحفظ — حاول تاني"))
        .finally(() => { btn.disabled = false; btn.textContent = "حفظ"; });
    }

    // ---------- Add new item ----------
    function openAdd() {
      document.getElementById("addName").value = "";
      document.getElementById("addPrice").value = "";
      document.getElementById("addCatNew").value = "";
      document.getElementById("addHasVariants").checked = false;
      document.getElementById("addV1Name").value = "صغير"; document.getElementById("addV1Price").value = "";
      document.getElementById("addV2Name").value = "كبير"; document.getElementById("addV2Price").value = "";
      toggleAddVariants();
      const sel = document.getElementById("addCatSelect"); sel.innerHTML = "";
      state.catOrder.forEach(cat => {
        const opt = document.createElement("option"); opt.value = cat; opt.textContent = cat; sel.appendChild(opt);
      });
      openSheet("addSheet");
    }

    function toggleAddVariants() {
      const on = document.getElementById("addHasVariants").checked;
      document.getElementById("addFlatPrice").style.display = on ? "none" : "block";
      document.getElementById("addVariants").style.display = on ? "block" : "none";
    }

    function saveAdd() {
      const name = document.getElementById("addName").value.trim();
      const catNew = document.getElementById("addCatNew").value.trim();
      const catSel = document.getElementById("addCatSelect").value;
      const category = catNew || catSel;
      if (!name) { alert("اكتب اسم الصنف"); return; }
      if (!category) { alert("اختار فئة أو اكتب فئة جديدة"); return; }

      const hasVariants = document.getElementById("addHasVariants").checked;
      let rows;
      if (hasVariants) {
        const v1n = document.getElementById("addV1Name").value.trim(), v1pRaw = document.getElementById("addV1Price").value;
        const v2n = document.getElementById("addV2Name").value.trim(), v2pRaw = document.getElementById("addV2Price").value;
        const v1p = Number(v1pRaw), v2p = Number(v2pRaw);
        if (!v1n || !v2n || v1pRaw === "" || v2pRaw === "" || isNaN(v1p) || isNaN(v2p) || v1p < 0 || v2p < 0) {
          alert("اكتب اسم وسعر صح لكل مقاس"); return;
        }
        rows = [{ variant: v1n, price: v1p }, { variant: v2n, price: v2p }];
      } else {
        const raw = document.getElementById("addPrice").value;
        const price = Number(raw);
        if (raw === "" || isNaN(price) || price < 0) { alert("السعر لازم يكون رقم"); return; }
        rows = [{ variant: "", price }];
      }

      // One id generated client-side and reused across all variant rows of this new item --
      // if each row asked the server to auto-generate its own id, a 2-variant new item
      // would come back as two UNRELATED items instead of one item with two sizes.
      const id = "new_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const btn = document.getElementById("addSave"); btn.disabled = true; btn.textContent = "جاري الإضافة…";
      Promise.all(rows.map(r => menuSet({
        item_id: id, category, name_ar: name, variant: r.variant, price_egp: r.price, active: "true",
      }))).then(results => {
        if (!results.every(r => r && r.ok)) throw new Error("save_failed");
        closeSheets();
        loadMenu(); // refetch rather than reconstruct locally -- simplest way to pick up a new category correctly
      }).catch(() => alert("حصل خطأ في الإضافة — حاول تاني"))
        .finally(() => { btn.disabled = false; btn.textContent = "إضافة"; });
    }

    // ---------- Edit an existing order (fix a mistake without cancelling) ----------
    // o.items trace back to the server's own JSON -- parsed into line items, never trusted
    // as HTML; every input value below is set via the DOM .value property (never
    // interpolated into innerHTML), so a malicious item name can't break out of an attribute
    // the way string concatenation into HTML would allow.
    // Cashier-entered order -- for a walk-in who pays at the counter instead of scanning a
    // table's QR. Embeds the real customer ordering page (same photos/categories/variants/
    // cart index.html already has, in its new cashier=1 mode) instead of making the cashier
    // type item names/prices from scratch. See
    // docs/superpowers/specs/2026-10-11-cashier-order-picker-design.md.
    function openNewOrder() {
      const url = `index.html?c=${encodeURIComponent(CLIENT)}&table=${encodeURIComponent("كاونتر")}&cashier=1`;
      document.getElementById("newOrderFrame").src = url;
      openSheet("newOrderSheet");
    }

    function openOrderEdit(o) {
      oeOrderId = o.id;
      document.getElementById("oeTable").value = o.table;
      const box = document.getElementById("oeItems"); box.innerHTML = "";
      let items;
      try {
        const parsed = JSON.parse(o.items);
        items = Array.isArray(parsed) ? parsed : null;
      } catch (e) { items = null; }
      if (!items || !items.length) items = [{ name: "", qty: 1, price: 0 }];
      items.forEach(it => addOeItemLine(it));
      document.getElementById("oeTotalCur").textContent = CUR;
      updateOeTotal();
      openSheet("orderEditSheet");
    }

    function addOeItemLine(it) {
      const box = document.getElementById("oeItems");
      const row = document.createElement("div");
      row.className = "oe-item-row";
      row.innerHTML = `
        <input class="oe-item-name" placeholder="اسم الصنف" />
        <input class="oe-item-qty" type="number" inputmode="numeric" placeholder="الكمية" />
        <input class="oe-item-price" type="number" inputmode="decimal" placeholder="السعر" />
        <button type="button" class="oe-item-remove" aria-label="حذف">🗑️</button>`;
      if (it) {
        row.querySelector(".oe-item-name").value = it.name || "";
        row.querySelector(".oe-item-qty").value = it.qty != null ? it.qty : "";
        row.querySelector(".oe-item-price").value = it.price != null ? it.price : "";
      }
      row.querySelector(".oe-item-remove").onclick = () => { row.remove(); updateOeTotal(); };
      row.querySelectorAll(".oe-item-qty, .oe-item-price").forEach(inp => inp.addEventListener("input", updateOeTotal));
      box.appendChild(row);
      updateOeTotal();
    }

    function oeRows() {
      return [...document.querySelectorAll("#oeItems .oe-item-row")].map(row => ({
        name: row.querySelector(".oe-item-name").value.trim(),
        qty: Number(row.querySelector(".oe-item-qty").value),
        price: Number(row.querySelector(".oe-item-price").value),
      }));
    }

    // Total is ALWAYS computed client-side from the line items (qty×price summed), never a
    // separately-typed field -- guarantees it can't disagree with what's listed.
    function updateOeTotal() {
      const total = oeRows().reduce((s, r) => s + ((isNaN(r.qty) || isNaN(r.price)) ? 0 : r.qty * r.price), 0);
      document.getElementById("oeTotal").textContent = total;
    }

    function saveOrderEdit() {
      const table = document.getElementById("oeTable").value.trim();
      if (!table) { alert("اكتب رقم الترابيزة"); return; }
      const rows = oeRows();
      if (!rows.length) { alert("لازم يكون فيه صنف واحد على الأقل"); return; }
      const bad = rows.some(r => !r.name || isNaN(r.qty) || r.qty <= 0 || isNaN(r.price) || r.price <= 0);
      if (bad) { alert("تأكد إن كل صنف عنده اسم وكمية وسعر صح"); return; }
      const total = rows.reduce((s, r) => s + r.qty * r.price, 0);

      const btn = document.getElementById("oeSave"); btn.disabled = true; btn.textContent = "جاري الحفظ…";
      const url = `${CFG.admin_webhook}?action=order_edit&id=${encodeURIComponent(oeOrderId)}`
        + `&table=${encodeURIComponent(table)}&items=${encodeURIComponent(JSON.stringify(rows))}`
        + `&total=${encodeURIComponent(total)}&key=${encodeURIComponent(CFG.admin_key || "")}`;
      fetch(url).then(r => r.json()).then(data => {
        if (data.error) { alert("خطأ: " + data.error); return; }
        closeSheets();
        refreshLive();
      }).catch(() => alert("تعذر الاتصال — حاول تاني"))
        .finally(() => { btn.disabled = false; btn.textContent = "حفظ"; });
    }

    function openSheet(id) { document.getElementById("scrim").classList.add("show"); document.getElementById(id).classList.add("show"); }
    function closeSheets() {
      document.getElementById("scrim").classList.remove("show");
      document.getElementById("editSheet").classList.remove("show");
      document.getElementById("addSheet").classList.remove("show");
      document.getElementById("orderEditSheet").classList.remove("show");
      document.getElementById("newOrderSheet").classList.remove("show");
      // Reset so reopening the cashier-order sheet always starts clean -- no stale
      // half-built cart left over from a previous session.
      document.getElementById("newOrderFrame").src = "about:blank";
    }

    // Receives {type:"waqti_order_sent"} from the embedded customer-ordering iframe once a
    // cashier-entered order has been sent successfully -- see openNewOrder() above. Origin-
    // checked both directions (index.html posts to location.origin explicitly, this checks
    // event.origin matches) so it can't be spoofed by unrelated embedded content.
    window.addEventListener("message", (e) => {
      if (e.origin !== location.origin) return;
      if (e.data && e.data.type === "waqti_order_sent") {
        closeSheets();
        refreshLive();
      }
    });
  </script>
</body>
</html>
