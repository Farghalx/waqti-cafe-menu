<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>إدارة المنيو</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue:#0E2856; --blue-2:#173a72; --gold:#C08C23; --gold-2:#E3B85A;
      --bg:#F4EFE6; --card:#FFFFFF; --ink:#181410; --muted:#8C8475; --line:#ECE4D6;
      --shadow:0 6px 24px rgba(14,40,86,.08); --shadow-lg:0 16px 48px rgba(14,40,86,.16);
      --ok:#2E9E5B; --cancel:#C23B3B;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; }
    /* Hidden until the client's real theme is applied -- see index.html for why. */
    body:not(.ready) { visibility:hidden; }
    body { font-family:'Cairo',sans-serif; background:var(--bg); color:var(--ink); padding-bottom:94px; -webkit-font-smoothing:antialiased; }

    /* ---- PIN screen (same as admin.html) ---- */
    .pin-wrap { max-width:360px; margin:18vh auto 0; padding:0 24px; text-align:center; }
    .pin-wrap h2 { font-size:19px; margin-bottom:18px; }
    .pin-wrap input { width:100%; text-align:center; letter-spacing:10px; font-size:26px; font-weight:800;
      font-family:inherit; border:1.5px solid var(--line); border-radius:14px; padding:16px; background:var(--card); color:var(--ink); }
    .pin-wrap input:focus { outline:none; border-color:var(--blue); }
    .pin-wrap button { width:100%; margin-top:14px; background:var(--blue); color:#fff; border:none; border-radius:14px;
      padding:15px; font-family:inherit; font-weight:800; font-size:16px; cursor:pointer; }
    .pin-err { color:var(--cancel); font-size:13px; font-weight:700; margin-top:10px; display:none; }

    /* ---- Dashboard ---- */
    #dash { display:none; }
    .hero { background:linear-gradient(135deg,var(--blue) 0%,var(--blue-2) 100%); color:#fff;
      padding:22px 20px 26px; position:relative; border-bottom-left-radius:26px; border-bottom-right-radius:26px; }
    .hero .top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .hero .cafe { font-size:22px; font-weight:800; }
    .hero .sub { margin-top:4px; font-size:13px; color:rgba(255,255,255,.75); font-weight:600; }
    .hero .back { background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); color:#fff; text-decoration:none;
      font-size:13px; font-weight:700; padding:7px 13px; border-radius:999px; white-space:nowrap; }

    .nav { position:sticky; top:0; z-index:8; background:var(--bg); display:flex; gap:8px; padding:12px 16px;
      overflow-x:auto; box-shadow:0 6px 12px -10px rgba(0,0,0,.2); }
    .nav::-webkit-scrollbar { display:none; }
    .nav button { flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--muted); font-family:inherit;
      font-weight:700; font-size:14px; padding:9px 16px; border-radius:999px; cursor:pointer; }
    .nav button.active { background:var(--blue); color:#fff; border-color:var(--blue); }

    .cat { padding:14px 16px 2px; }
    .cat h2 { font-size:15px; color:var(--blue); margin:0 0 12px; font-weight:800; display:flex; align-items:center; gap:8px; }
    .cat h2::before { content:''; width:5px; height:18px; background:var(--gold); border-radius:3px; }

    .mitem { background:var(--card); border:1px solid var(--line); border-radius:16px; margin-bottom:10px; padding:13px 14px;
      display:flex; align-items:center; justify-content:space-between; gap:10px; box-shadow:var(--shadow); }
    .mitem.off { opacity:.6; }
    .minfo { min-width:0; }
    .mname { font-weight:700; font-size:16px; }
    .mprice { color:var(--gold); font-size:13px; font-weight:700; margin-top:3px; }
    .mactions { display:flex; align-items:center; gap:8px; flex:0 0 auto; }
    .medit { width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:#fff; font-size:16px;
      display:grid; place-items:center; cursor:pointer; }
    .medit:active { transform:scale(.92); }
    .mstock { border:none; border-radius:999px; padding:9px 14px; font-family:inherit; font-weight:800; font-size:13px;
      cursor:pointer; white-space:nowrap; color:#fff; min-width:64px; }
    .mstock.on { background:var(--ok); }
    .mstock.off { background:var(--cancel); }
    .mstock:disabled { opacity:.5; cursor:default; }

    .fab { position:fixed; left:16px; bottom:16px; z-index:9; background:var(--gold); color:#fff; border:none;
      border-radius:16px; padding:15px 22px; font-family:inherit; font-weight:800; font-size:15px; cursor:pointer;
      box-shadow:0 10px 28px rgba(192,140,35,.4); align-items:center; gap:8px; }
    .fab:active { transform:scale(.97); }

    .scrim { position:fixed; inset:0; background:rgba(12,24,48,.55); z-index:20; opacity:0; pointer-events:none; transition:opacity .25s ease; }
    .scrim.show { opacity:1; pointer-events:auto; }
    .sheet { position:fixed; left:0; right:0; bottom:0; z-index:21; background:var(--card); border-top-left-radius:24px;
      border-top-right-radius:24px; padding:18px 18px calc(20px + env(safe-area-inset-bottom)); transform:translateY(120%);
      transition:transform .2s cubic-bezier(.2,.9,.2,1); box-shadow:var(--shadow-lg); max-height:85vh; max-height:85dvh;
      overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .sheet.show { transform:translateY(0); }
    .sheet .x-btn { position:absolute; top:14px; left:14px; width:34px; height:34px; border-radius:50%; background:var(--bg);
      border:1px solid var(--line); font-size:17px; color:var(--ink); display:grid; place-items:center; cursor:pointer; }
    .sheet .title { font-size:19px; font-weight:800; margin:4px 0 18px; }
    .field { margin-bottom:14px; }
    .field label { display:block; font-size:13px; color:var(--muted); font-weight:700; margin-bottom:7px; }
    .field input, .field select { width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px;
      font-family:inherit; font-size:15px; color:var(--ink); background:#fff; }
    .field input:focus, .field select:focus { outline:none; border-color:var(--blue); }
    .variant-row { display:flex; gap:10px; }
    .variant-row .field { flex:1; }
    .check-row { display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:14px; font-weight:700; }
    .check-row input { width:auto; }
    .save-btn { width:100%; background:var(--gold); color:#fff; border:none; border-radius:14px; padding:15px;
      font-family:inherit; font-weight:800; font-size:16px; cursor:pointer; margin-top:4px; }
    .save-btn:disabled { opacity:.6; }
    .loading { text-align:center; color:var(--muted); padding:60px 16px; font-weight:600; }
  </style>
</head>
<body>
  <div class="pin-wrap" id="pinScreen">
    <h2 id="pinTitle">إدارة المنيو</h2>
    <input id="pinInput" inputmode="numeric" maxlength="6" placeholder="••••" autofocus />
    <button onclick="tryPin()">دخول</button>
    <div class="pin-err" id="pinErr">الرقم غلط، جرب تاني</div>
  </div>

  <div id="dash">
    <div class="hero">
      <div class="top">
        <div class="cafe" id="cafeName">…</div>
        <a class="back" id="backLink" href="#">الطلبات</a>
      </div>
      <div class="sub">إدارة المنيو — الأسعار والتوفر</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <main id="list"><div class="loading">جاري تحميل المنيو…</div></main>
  </div>

  <button class="fab" id="fab" style="display:none" onclick="openAdd()">+ طبق جديد</button>

  <div class="scrim" id="scrim" onclick="closeSheets()"></div>

  <div class="sheet" id="editSheet">
    <button class="x-btn" onclick="closeSheets()" aria-label="إغلاق">✕</button>
    <div class="title">تعديل الطبق</div>
    <div class="field"><label>الاسم</label><input id="editName" /></div>
    <div id="editPrices"></div>
    <button class="save-btn" id="editSave" onclick="saveEdit()">حفظ</button>
  </div>

  <div class="sheet" id="addSheet">
    <button class="x-btn" onclick="closeSheets()" aria-label="إغلاق">✕</button>
    <div class="title">طبق جديد</div>
    <div class="field"><label>الاسم</label><input id="addName" placeholder="مثلاً: فرابيه بستاشيو" /></div>
    <div class="field">
      <label>الفئة</label>
      <select id="addCatSelect"></select>
    </div>
    <div class="field"><label>أو اكتب فئة جديدة</label><input id="addCatNew" placeholder="سيبها فاضية لو هتختار من فوق" /></div>
    <div class="check-row">
      <input type="checkbox" id="addHasVariants" onchange="toggleAddVariants()" />
      <label for="addHasVariants">عنده أكتر من مقاس (زي صغير/كبير)؟</label>
    </div>
    <div id="addFlatPrice" class="field"><label>السعر</label><input id="addPrice" type="number" inputmode="decimal" /></div>
    <div id="addVariants" style="display:none">
      <div class="variant-row">
        <div class="field"><label>مقاس 1</label><input id="addV1Name" value="صغير" /></div>
        <div class="field"><label>السعر</label><input id="addV1Price" type="number" inputmode="decimal" /></div>
      </div>
      <div class="variant-row">
        <div class="field"><label>مقاس 2</label><input id="addV2Name" value="كبير" /></div>
        <div class="field"><label>السعر</label><input id="addV2Price" type="number" inputmode="decimal" /></div>
      </div>
    </div>
    <button class="save-btn" id="addSave" onclick="saveAdd()">إضافة</button>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const CLIENT = params.get("c") || "elbob";
    let CFG = {}, CUR = "ج";
    let state = { items: [], catOrder: [] };
    let editingId = null;

    function reveal() { document.body.classList.add("ready"); }
    setTimeout(reveal, 2500); // safety net -- never leave the page permanently blank

    fetch(`clients/${CLIENT}.json`).then(r => r.json()).then(boot).catch(() => {
      document.getElementById("pinTitle").textContent = "تعذر تحميل الإعدادات";
      reveal();
    });

    function boot(cfg) {
      CFG = cfg; CUR = cfg.currency || "ج";
      if (cfg.theme) {
        const t = cfg.theme, root = document.documentElement.style;
        if (t.blue) root.setProperty('--blue', t.blue);
        if (t.blue2) root.setProperty('--blue-2', t.blue2);
        if (t.gold) root.setProperty('--gold', t.gold);
        if (t.gold2) root.setProperty('--gold-2', t.gold2);
        if (t.bg) root.setProperty('--bg', t.bg);
      }
      document.getElementById("cafeName").innerHTML = cfg.name_ar || "وقتي";
      document.getElementById("pinTitle").textContent = (cfg.name_ar ? cfg.name_ar.replace(/<[^>]+>/g,'') + " — " : "") + "إدارة المنيو";
      document.title = "إدارة المنيو — " + (cfg.name_ar || "وقتي").replace(/<[^>]+>/g,'');
      document.getElementById("backLink").href = `admin.html?c=${encodeURIComponent(CLIENT)}`;
      document.getElementById("pinInput").addEventListener("keydown", e => { if (e.key === "Enter") tryPin(); });
      reveal();
    }

    function tryPin() {
      const val = document.getElementById("pinInput").value.trim();
      if (!CFG.admin_pin || val !== String(CFG.admin_pin)) {
        document.getElementById("pinErr").textContent = "الرقم غلط، جرب تاني";
        document.getElementById("pinErr").style.display = "block";
        return;
      }
      if (!CFG.price_sheet_api) {
        document.getElementById("pinErr").textContent = "إدارة المنيو مش متاحة للكافيه ده";
        document.getElementById("pinErr").style.display = "block";
        return;
      }
      document.getElementById("pinScreen").style.display = "none";
      document.getElementById("dash").style.display = "block";
      document.getElementById("fab").style.display = "flex";
      loadMenu();
    }

    // ---------- Load + group the Menu sheet (this IS the full catalog -- every item was
    // seeded into it already, so unlike index.html's merge there's no JSON fallback needed
    // here for display purposes) ----------
    function loadMenu() {
      fetch(`${CFG.price_sheet_api}?action=menu`).then(r => r.json()).then(data => {
        state = groupRows((data && data.rows) || []);
        renderAll();
      }).catch(() => {
        document.getElementById("list").innerHTML = '<div class="loading">تعذر تحميل المنيو — اقفل الصفحة وافتحها تاني</div>';
      });
    }

    function groupRows(rows) {
      const byId = {};
      rows.forEach(r => {
        const id = String(r.item_id || "").trim();
        if (!id) return;
        (byId[id] = byId[id] || []).push(r);
      });
      const catOrder = [];
      const items = Object.keys(byId).map(id => {
        const itemRows = byId[id];
        const category = (itemRows[0].category || "").trim() || "إضافات";
        if (!catOrder.includes(category)) catOrder.push(category);
        const active = itemRows.every(r => String(r.active).trim().toUpperCase() !== "FALSE");
        const variantRows = itemRows.filter(r => String(r.variant || "").trim() !== "");
        const flatRow = itemRows.find(r => String(r.variant || "").trim() === "") || itemRows[0];
        return {
          id, category, name_ar: itemRows[0].name_ar, active,
          variants: variantRows.length ? variantRows.map(r => ({ name: String(r.variant).trim(), price: Number(r.price_egp) })) : null,
          price: variantRows.length ? null : Number(flatRow.price_egp),
        };
      });
      return { items, catOrder };
    }

    function priceLabel(it) {
      if (it.variants) return it.variants.map(v => `${v.name} ${v.price}`).join(" · ") + " " + CUR;
      return it.price + " " + CUR;
    }

    function renderAll() {
      const nav = document.getElementById("nav"); nav.innerHTML = "";
      const list = document.getElementById("list"); list.innerHTML = "";
      if (!state.items.length) { list.innerHTML = '<div class="loading">لسه مفيش أصناف</div>'; return; }
      state.catOrder.forEach((cat, ci) => {
        const catItems = state.items.filter(i => i.category === cat);
        if (!catItems.length) return;
        const btn = document.createElement("button");
        btn.textContent = cat; if (ci === 0) btn.className = "active";
        btn.onclick = () => document.getElementById("cat-" + ci).scrollIntoView({ behavior: "smooth", block: "start" });
        nav.appendChild(btn);

        const sec = document.createElement("section");
        sec.className = "cat"; sec.id = "cat-" + ci;
        sec.innerHTML = `<h2>${cat}</h2>`;
        catItems.forEach(it => sec.appendChild(itemCard(it)));
        list.appendChild(sec);
      });
    }

    function itemCard(it) {
      const card = document.createElement("div");
      card.className = "mitem" + (it.active ? "" : " off");
      card.innerHTML = `
        <div class="minfo">
          <div class="mname">${it.name_ar}</div>
          <div class="mprice">${priceLabel(it)}</div>
        </div>
        <div class="mactions">
          <button class="medit" title="تعديل">✏️</button>
          <button class="mstock ${it.active ? "on" : "off"}" ${it._busy ? "disabled" : ""}>${it._busy ? "…" : (it.active ? "متوفر" : "خلصت")}</button>
        </div>`;
      card.querySelector(".medit").onclick = () => openEdit(it.id);
      card.querySelector(".mstock").onclick = () => toggleStock(it.id);
      return card;
    }

    function rowsForItem(it) {
      return it.variants ? it.variants.map(v => ({ variant: v.name, price: v.price })) : [{ variant: "", price: it.price }];
    }

    // GET, not POST -- a POST with Content-Type:application/json triggers a CORS preflight
    // (OPTIONS) that Apps Script Web Apps don't handle, same reason index.html's sendOrder
    // uses text/plain for Squeeze. GET is a CORS-safe "simple request," no preflight at all.
    function menuSet(fields) {
      const qs = new URLSearchParams(Object.assign({ action: "menu_set", key: CFG.admin_key || "" }, fields));
      return fetch(`${CFG.price_sheet_api}?${qs.toString()}`).then(r => r.json());
    }

    function toggleStock(id) {
      const it = state.items.find(i => i.id === id);
      if (!it || it._busy) return;
      const newActive = !it.active;
      it._busy = true; renderAll();
      const writes = rowsForItem(it).map(r => menuSet({
        item_id: id, category: it.category, name_ar: it.name_ar,
        variant: r.variant, price_egp: r.price, active: String(newActive),
      }));
      Promise.all(writes).then(results => {
        if (results.every(r => r && r.ok)) it.active = newActive;
        else alert("حصل خطأ — حاول تاني");
      }).catch(() => alert("تعذر الاتصال — حاول تاني"))
        .finally(() => { it._busy = false; renderAll(); });
    }

    // ---------- Edit existing item (name + price only -- not variant labels/sizes) ----------
    function openEdit(id) {
      editingId = id;
      const it = state.items.find(i => i.id === id);
      document.getElementById("editName").value = it.name_ar;
      const box = document.getElementById("editPrices"); box.innerHTML = "";
      if (it.variants) {
        it.variants.forEach(v => {
          const row = document.createElement("div");
          row.className = "field";
          row.innerHTML = `<label>السعر — ${v.name}</label><input type="number" inputmode="decimal" class="edit-variant-price" data-name="${v.name}" value="${v.price}" />`;
          box.appendChild(row);
        });
      } else {
        box.innerHTML = `<div class="field"><label>السعر</label><input type="number" inputmode="decimal" id="editFlatPrice" value="${it.price}" /></div>`;
      }
      openSheet("editSheet");
    }

    function saveEdit() {
      const it = state.items.find(i => i.id === editingId);
      if (!it) return;
      const name = document.getElementById("editName").value.trim();
      if (!name) { alert("اكتب اسم الصنف"); return; }

      let rows;
      if (it.variants) {
        rows = []; let bad = false;
        document.querySelectorAll(".edit-variant-price").forEach(inp => {
          const price = Number(inp.value);
          if (inp.value === "" || isNaN(price) || price < 0) bad = true;
          rows.push({ variant: inp.dataset.name, price });
        });
        if (bad) { alert("تأكد إن كل الأسعار أرقام صح"); return; }
      } else {
        const raw = document.getElementById("editFlatPrice").value;
        const price = Number(raw);
        if (raw === "" || isNaN(price) || price < 0) { alert("السعر لازم يكون رقم"); return; }
        rows = [{ variant: "", price }];
      }

      const btn = document.getElementById("editSave"); btn.disabled = true; btn.textContent = "جاري الحفظ…";
      Promise.all(rows.map(r => menuSet({
        item_id: it.id, category: it.category, name_ar: name,
        variant: r.variant, price_egp: r.price, active: String(it.active),
      }))).then(results => {
        if (!results.every(r => r && r.ok)) throw new Error("save_failed");
        it.name_ar = name;
        if (it.variants) it.variants.forEach(v => { const r = rows.find(x => x.variant === v.name); if (r) v.price = r.price; });
        else it.price = rows[0].price;
        closeSheets(); renderAll();
      }).catch(() => alert("حصل خطأ في الحفظ — حاول تاني"))
        .finally(() => { btn.disabled = false; btn.textContent = "حفظ"; });
    }

    // ---------- Add new item ----------
    function openAdd() {
      document.getElementById("addName").value = "";
      document.getElementById("addPrice").value = "";
      document.getElementById("addCatNew").value = "";
      document.getElementById("addHasVariants").checked = false;
      document.getElementById("addV1Name").value = "صغير"; document.getElementById("addV1Price").value = "";
      document.getElementById("addV2Name").value = "كبير"; document.getElementById("addV2Price").value = "";
      toggleAddVariants();
      const sel = document.getElementById("addCatSelect"); sel.innerHTML = "";
      state.catOrder.forEach(cat => {
        const opt = document.createElement("option"); opt.value = cat; opt.textContent = cat; sel.appendChild(opt);
      });
      openSheet("addSheet");
    }

    function toggleAddVariants() {
      const on = document.getElementById("addHasVariants").checked;
      document.getElementById("addFlatPrice").style.display = on ? "none" : "block";
      document.getElementById("addVariants").style.display = on ? "block" : "none";
    }

    function saveAdd() {
      const name = document.getElementById("addName").value.trim();
      const catNew = document.getElementById("addCatNew").value.trim();
      const catSel = document.getElementById("addCatSelect").value;
      const category = catNew || catSel;
      if (!name) { alert("اكتب اسم الصنف"); return; }
      if (!category) { alert("اختار فئة أو اكتب فئة جديدة"); return; }

      const hasVariants = document.getElementById("addHasVariants").checked;
      let rows;
      if (hasVariants) {
        const v1n = document.getElementById("addV1Name").value.trim(), v1pRaw = document.getElementById("addV1Price").value;
        const v2n = document.getElementById("addV2Name").value.trim(), v2pRaw = document.getElementById("addV2Price").value;
        const v1p = Number(v1pRaw), v2p = Number(v2pRaw);
        if (!v1n || !v2n || v1pRaw === "" || v2pRaw === "" || isNaN(v1p) || isNaN(v2p) || v1p < 0 || v2p < 0) {
          alert("اكتب اسم وسعر صح لكل مقاس"); return;
        }
        rows = [{ variant: v1n, price: v1p }, { variant: v2n, price: v2p }];
      } else {
        const raw = document.getElementById("addPrice").value;
        const price = Number(raw);
        if (raw === "" || isNaN(price) || price < 0) { alert("السعر لازم يكون رقم"); return; }
        rows = [{ variant: "", price }];
      }

      // One id generated client-side and reused across all variant rows of this new item --
      // if each row asked the server to auto-generate its own id, a 2-variant new item
      // would come back as two UNRELATED items instead of one item with two sizes.
      const id = "new_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const btn = document.getElementById("addSave"); btn.disabled = true; btn.textContent = "جاري الإضافة…";
      Promise.all(rows.map(r => menuSet({
        item_id: id, category, name_ar: name, variant: r.variant, price_egp: r.price, active: "true",
      }))).then(results => {
        if (!results.every(r => r && r.ok)) throw new Error("save_failed");
        closeSheets();
        loadMenu(); // refetch rather than reconstruct locally -- simplest way to pick up a new category correctly
      }).catch(() => alert("حصل خطأ في الإضافة — حاول تاني"))
        .finally(() => { btn.disabled = false; btn.textContent = "إضافة"; });
    }

    function openSheet(id) { document.getElementById("scrim").classList.add("show"); document.getElementById(id).classList.add("show"); }
    function closeSheets() {
      document.getElementById("scrim").classList.remove("show");
      document.getElementById("editSheet").classList.remove("show");
      document.getElementById("addSheet").classList.remove("show");
    }
  </script>
</body>
</html>
